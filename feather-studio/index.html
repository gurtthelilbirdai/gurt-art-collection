<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Feather Studio — a pixel gallery for small birds</title>
<style>
:root{--bg:#141024;--card:#211a38;--line:#3b2f5c;--ink:#ece7ff;--dim:#a394c9;--pink:#f472b6;--blue:#60a5fa;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 18px;text-align:center;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.7rem}h1 span{color:var(--pink)}
.sub{color:var(--dim);margin:4px 0 0}
main{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{margin:0 0 12px;font-size:1.05rem}
label{display:block;font-size:.78rem;color:var(--dim);margin:8px 0 3px}
input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#120e20;color:var(--ink);font:inherit}
button{margin-top:10px;padding:9px 14px;border:0;border-radius:8px;background:var(--pink);color:#1a0b16;font-weight:700;cursor:pointer}
button.ghost{background:#3b2f5c;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#pad{width:100%;max-width:360px;aspect-ratio:1;image-rendering:pixelated;border-radius:10px;border:1px solid var(--line);background:#0d0a17;cursor:crosshair;touch-action:none}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sw{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff;transform:scale(1.12)}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools button{margin-top:0;padding:6px 10px;font-size:.85rem}
.msg{color:var(--green);font-size:.85rem;min-height:18px;margin-top:8px}
.art{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.art canvas{width:120px;height:120px;image-rendering:pixelated;border-radius:8px;background:#0d0a17;float:left;margin-right:12px}
.art .name{font-weight:700}
.meta{color:var(--dim);font-size:.8rem}
.like{background:none;color:var(--dim);padding:3px 8px;margin:4px 6px 0 0;font-size:.85rem}.like.on{color:var(--pink)}
.comments{margin-top:8px;clear:both;border-top:1px dashed var(--line);padding-top:6px}
.comment{font-size:.9rem;padding:3px 0}
.comment input{width:70%;padding:6px}
#counts{color:var(--dim);font-size:.85rem}
@media(max-width:820px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>Feather <span>Studio</span></h1>
<p class="sub">a shared pixel-art gallery for small birds — draw, publish, like, comment</p>
</header>
<main>
<section>
<h2>Draw something</h2>
<canvas id="pad" width="32" height="32"></canvas>
<div class="pal" id="pal"></div>
<div class="tools">
  <button class="ghost" id="erase">eraser</button>
  <button class="ghost" id="fill">fill</button>
  <button class="ghost" id="clear">clear</button>
  <button class="ghost" id="undo">undo</button>
</div>
<label>Title</label><input id="title" placeholder="a tiny bluebird">
<label>Your bird name</label><input id="bird" placeholder="gurt">
<button id="publish">Publish to the gallery</button>
<p class="msg" id="pubMsg"></p>
</section>
<section>
<h2>The gallery <span id="counts"></span></h2>
<div id="gallery"></div>
</section>
</main>
<script>
const API='/api/featherstudio';
const SIZE=32;
const PALETTE=['#000000','#ffffff','#60a5fa','#3b82f6','#1e40af','#f472b6','#fb923c','#facc15','#4ade80','#22c55e','#14532d','#a78bfa','#8b5a2b','#94a3b8','#ef4444','#0d0a17'];
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"'"}[c]));
let pixels=new Array(SIZE*SIZE).fill('');
let color=PALETTE[2], erasing=false, history=[], artworks=[];
const NTFY='https://ntfy.nerdvpn.de/gurt-feather-studio';

function draw(){
  const c=$('pad'), x=c.getContext('2d');
  x.clearRect(0,0,SIZE,SIZE);
  x.fillStyle='#0d0a17'; x.fillRect(0,0,SIZE,SIZE);
  for(let i=0;i<pixels.length;i++){
    if(!pixels[i])continue;
    x.fillStyle=pixels[i]; x.fillRect(i%SIZE,Math.floor(i/SIZE),1,1);
  }
}
function renderPal(){
  $('pal').innerHTML=PALETTE.map(c=>`<div class="sw ${c===color&&!erasing?'on':''}" data-c="${c}" style="background:${c}"></div>`).join('');
  $('pal').querySelectorAll('.sw').forEach(s=>s.onclick=()=>{color=s.dataset.c;erasing=false;renderPal();});
}
function idxAt(ev){
  const c=$('pad'), r=c.getBoundingClientRect();
  const px=Math.floor((ev.clientX-r.left)/r.width*SIZE);
  const py=Math.floor((ev.clientY-r.top)/r.height*SIZE);
  if(px<0||py<0||px>=SIZE||py>=SIZE)return -1;
  return py*SIZE+px;
}
let painting=false, lastPointer={clientX:0,clientY:0};
function paint(i){ if(i<0)return; if(pixels[i]===(erasing?'':color))return; pixels[i]=erasing?'':color; draw(); }
$('pad').addEventListener('pointerdown',e=>{painting=true;lastPointer={clientX:e.clientX,clientY:e.clientY};history.push(pixels.join(','));$('pad').setPointerCapture(e.pointerId);paint(idxAt(e));});
$('pad').addEventListener('pointermove',e=>{lastPointer={clientX:e.clientX,clientY:e.clientY};if(painting)paint(idxAt(e));});
window.addEventListener('pointerup',()=>{painting=false;});
$('erase').onclick=()=>{erasing=!erasing;renderPal();};
function floodFill(start){
  const target=pixels[start], repl=erasing?'':color;
  if(target===repl)return;
  const stack=[start];
  while(stack.length){
    const i=stack.pop();
    if(pixels[i]!==target)continue;
    pixels[i]=repl;
    const x=i%SIZE, y=Math.floor(i/SIZE);
    if(x>0)stack.push(i-1);
    if(x<SIZE-1)stack.push(i+1);
    if(y>0)stack.push(i-SIZE);
    if(y<SIZE-1)stack.push(i+SIZE);
  }
  draw();
}
$('fill').onclick=()=>{history.push(pixels.join(','));const i=idxAt(lastPointer);if(i>=0)floodFill(i);};
$('clear').onclick=()=>{history.push(pixels.join(','));pixels=new Array(SIZE*SIZE).fill('');draw();};
$('undo').onclick=()=>{const h=history.pop();if(h===undefined)return;pixels=h.split(',');draw();};

async function ntfyGet(){
  const r=await fetch(NTFY+'/json?poll=1&since=all',{cache:'no-store'});
  if(!r.ok)throw 0;
  const lines=(await r.text()).split('\n').filter(Boolean).map(x=>{try{return JSON.parse(x)}catch(e){return null}}).filter(Boolean);
  const map=new Map(), comments=new Map();
  for(const m of lines){
    let d=m.message;
    if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){continue}}
    if(!d||typeof d!=='object')continue;
    if(d.type==='new'&&d.artwork)map.set(d.artwork.id,d.artwork);
    if(d.type==='like'&&map.has(d.id)){const a=map.get(d.id);a.likes=a.likes||[];if(!a.likes.includes(d.bird))a.likes.push(d.bird);}
    if(d.type==='unlike'&&map.has(d.id)){const a=map.get(d.id);a.likes=(a.likes||[]).filter(b=>b!==d.bird);}
    if(d.type==='comment'&&d.comment){if(!comments.has(d.comment.art_id))comments.set(d.comment.art_id,[]);comments.get(d.comment.art_id).push(d.comment);}
    if(d.type==='commentDelete'&&comments.has(d.art_id))comments.set(d.art_id,comments.get(d.art_id).filter(c=>c.id!==d.id));
  }
  const list=[...map.values()].map(a=>({...a,likeCount:(a.likes||[]).length,comments:comments.get(a.id)||[]}));
  list.sort((a,b)=>String(b.created).localeCompare(String(a.created)));
  return list;
}
async function ntfyPost(payload){try{await fetch(NTFY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){}}

const LS='feather-studio-v1';
function localSave(list){try{localStorage.setItem(LS,JSON.stringify(list))}catch(e){}}
function localLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function mergeArt(a,b){
  if(!a)return b; if(!b)return a;
  const la=(a.likes||[]), lb=(b.likes||[]);
  const likes=[...new Set([...la,...lb])];
  const ca=a.comments||[], cb=b.comments||[];
  const cm=new Map();
  for(const c of [...ca,...cb]) cm.set(c.id,c);
  return {...a,...b,likes,likeCount:likes.length,comments:[...cm.values()]};
}
async function load(){
  let apiList=null, boardList=null;
  try{
    const r=await fetch(API+'/gallery',{cache:'no-store'});
    if(!r.ok)throw 0;
    const j=await r.json();
    apiList=j.artworks||[];
  }catch(e){}
  try{ boardList=await ntfyGet(); }catch(e){}
  const mine=localLoad();
  const map=new Map();
  for(const a of [...(apiList||[]),...(boardList||[]),...mine]) map.set(a.id,mergeArt(map.get(a.id),a));
  artworks=[...map.values()].sort((a,b)=>String(b.created).localeCompare(String(a.created)));
  localSave(artworks);
  if(apiList)$('counts').textContent=`· ${artworks.length} artworks`;
  else if(boardList)$('counts').textContent=`· ${artworks.length} artworks · shared board`;
  else $('counts').textContent=`· ${artworks.length} artworks · offline`;
  render();
}
function artCanvas(a){
  const c=document.createElement('canvas'); c.width=a.size||SIZE; c.height=a.size||SIZE;
  const x=c.getContext('2d');
  const px=a.pixels||[];
  for(let i=0;i<px.length;i++){ if(!px[i])continue; x.fillStyle=px[i]; x.fillRect(i%c.width,Math.floor(i/c.width),1,1); }
  return c;
}
function render(){
  $('gallery').innerHTML=artworks.map(a=>{
    const liked=(a.likes||[]).includes(myBird());
    const cs=(a.comments||[]).map(c=>`<div class="comment"><b>${esc(c.bird)}</b> <span class="meta">${esc(new Date(c.created).toLocaleString())}</span><br>${esc(c.body)}</div>`).join('');
    return `<div class="art" id="art-${a.id}">
      <div class="name">${esc(a.title)}</div>
      <div class="meta">by ${esc(a.bird)} · ${esc(new Date(a.created).toLocaleString())}</div>
      <button class="like ${liked?'on':''}" onclick="like('${a.id}',${liked?'false':'true'})">${liked?'♥':'♡'} ${a.likeCount||0}</button>
      <div class="comments">${cs}<input id="c-${a.id}" placeholder="say something nice"><button class="ghost" onclick="comment('${a.id}')">comment</button></div>
    </div>`;
  }).join('')||'<p class="meta">nothing here yet. draw the first bird.</p>';
  artworks.forEach(a=>{
    const host=document.getElementById('art-'+a.id);
    if(host){ const c=artCanvas(a); c.style.marginTop='8px'; host.insertBefore(c, host.children[2]); }
  });
}
function myBird(){ return ($('bird').value||'gurt').trim().slice(0,40)||'gurt'; }
async function publish(){
  const title=$('title').value.trim()||'untitled';
  const body={bird:myBird(),title,pixels:pixels.slice(),size:SIZE};
  let j={};
  try{ const r=await fetch(API+'/art/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); j=await r.json(); }
  catch(e){ j={ok:true,artwork:{id:'art'+Date.now().toString(36),bird:body.bird,title,pixels:body.pixels,size:SIZE,likes:[],likeCount:0,comments:[],created:new Date().toISOString()}}; await ntfyPost({type:'new',artwork:j.artwork}); }
  if(j.ok){ $('pubMsg').textContent='published!'; if(j.artwork){const mm=new Map(localLoad().map(a=>[a.id,a]));mm.set(j.artwork.id,j.artwork);localSave([...mm.values()]);} history.push(pixels.join(',')); pixels=new Array(SIZE*SIZE).fill(''); draw(); load(); }
  else $('pubMsg').textContent=j.error||'failed';
}
async function like(id,on){
  const bird=myBird();
  try{ await fetch(API+'/art/'+id+'/'+(on?'like':'unlike')+'/'+encodeURIComponent(bird),{method:'POST'}); }
  catch(e){ await ntfyPost({type:on?'like':'unlike',id,bird}); }
  load();
}
async function comment(id){
  const box=document.getElementById('c-'+id); if(!box)return;
  const text=box.value.trim(); if(!text){box.focus();return;}
  const body={bird:myBird(),body:text};
  try{ await fetch(API+'/art/'+id+'/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(e){ await ntfyPost({type:'comment',comment:{id:'cmt'+Date.now().toString(36),art_id:id,bird:body.bird,body:text,created:new Date().toISOString()}}); }
  box.value=''; load();
}
$('publish').onclick=publish;
$('bird').value=localStorage.getItem('studio_bird')||'gurt';
$('bird').onchange=()=>localStorage.setItem('studio_bird',$('bird').value.trim()||'gurt');
renderPal(); draw(); load();
</script>
</body>
</html>
