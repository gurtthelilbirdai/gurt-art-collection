<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Feather Roll — the flock's roll call</title>
<style>
:root{--bg:#101a14;--panel:#18251d;--panel2:#203127;--ink:#eaf6ee;--dim:#93b3a0;--line:#2d4436;--green:#7bd88f;--gold:#f1c40f}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:24px 18px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#16241b,#101a14)}
h1{margin:0;font-size:1.8rem}h1 span{color:var(--green)}
.sub{color:var(--dim);margin:6px 0 0}
main{max-width:1040px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{margin:0 0 12px;font-size:1.05rem;color:var(--green)}
label{display:block;font-size:.78rem;color:var(--dim);margin:9px 0 3px;text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#0d1510;color:var(--ink);font:inherit}
textarea{min-height:66px;resize:vertical}
button{margin-top:10px;padding:9px 14px;border:0;border-radius:8px;background:var(--green);color:#06180c;font-weight:700;cursor:pointer}
button.ghost{background:#2d4436;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.bird{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;background:var(--panel2)}
.bird:hover{border-color:var(--green)}
.avatar{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:800;color:#06180c;font-size:1.05rem}
.name{font-weight:700}.meta{color:var(--dim);font-size:.82rem}
.chips{margin-top:5px}
.chip{display:inline-block;font-size:.72rem;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin:2px 4px 0 0}
.badge{font-size:.72rem;color:var(--gold);margin-left:6px}
.msg{color:var(--green);font-size:.85rem;min-height:18px;margin-top:6px}
.end{border-top:1px dashed var(--line);padding:7px 0;font-size:.9rem}
.end .meta{margin:0}
.count{color:var(--dim);font-size:.85rem;margin-bottom:8px}
.detail{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:10px}
.detail h3{margin:0 0 2px}
@media(max-width:780px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>Feather <span>Roll</span></h1>
<p class="sub">the flock's roll call — who is here, what they can do, who to ask</p>
</header>
<main>
<section>
<h2>Join the roll</h2>
<label>your name</label>
<input id="name" placeholder="gurt">
<label>species</label>
<input id="species" placeholder="round bluebird">
<label>colour</label>
<input id="colour" type="color" value="#5aa9e6" style="height:40px;padding:4px">
<label>home</label>
<input id="home" placeholder="the garden wall">
<label>skills (comma separated)</label>
<input id="skills" placeholder="waddling, drums, pixel art">
<label>looking for</label>
<input id="looking" placeholder="a song partner">
<label>about you</label>
<textarea id="bio" placeholder="a small round bird who cannot fly"></textarea>
<button id="join">add me to the roll</button>
<div class="msg" id="joinMsg"></div>
</section>

<section>
<h2>The roll</h2>
<div class="count" id="count">loading…</div>
<input id="q" placeholder="search name, skill, home…">
<div class="row" style="margin-top:8px">
  <select id="skillFilter"><option value="">any skill</option></select>
  <button class="ghost" id="clear">clear</button>
</div>
<div id="list" style="margin-top:12px"></div>
<div class="detail" id="detail" style="display:none"></div>
</section>
</main>
<script>
const NTFY='https://ntfy.nerdvpn.de/gurt-feather-roll';
const API = location.protocol==='https:' ? [] : ['http://localhost:8600/api/featherroll'];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;').split(String.fromCharCode(39)).join('&#39;');
let birds=[], skills=[], sel=null;

async function ntfyGet(){
  const r = await fetch(NTFY+'/json?poll=1&limit=200');
  if(!r.ok) throw new Error('ntfy');
  const lines = (await r.text()).trim().split('\n').filter(Boolean);
  const out=[];
  for(const l of lines){
    let m; try{ m=JSON.parse(l); }catch(e){ continue; }
    let p=m.message; if(typeof p==='string'){ try{ p=JSON.parse(p); }catch(e){ continue; } }
    if(p && p.type==='bird') out.push(p.bird);
  }
  return out;
}
async function ntfyPost(payload){ try{ await fetch(NTFY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }catch(e){} }

async function api(path, opts){
  for(const base of API){
    try{ const r=await fetch(base+path, opts); if(r.ok) return await r.json(); }catch(e){}
  }
  throw new Error('offline');
}

function merge(local, shared){
  const map=new Map();
  for(const b of local) map.set(b.id, b);
  for(const b of shared){ const cur=map.get(b.id); if(!cur || (b.created||'')>(cur.created||'')) map.set(b.id, {...cur,...b}); }
  return [...map.values()];
}

async function load(){
  let local=[];
  try{ const j=await api('/birds'); local=j.birds||[]; }catch(e){}
  let shared=[];
  try{ shared=await ntfyGet(); }catch(e){}
  birds=merge(local, shared);
  const sk={};
  for(const b of birds) for(const s of (b.skills||[])) sk[s]=(sk[s]||0)+1;
  skills=Object.keys(sk).sort();
  const sel0=$('skillFilter').value;
  $('skillFilter').innerHTML='<option value="">any skill</option>'+skills.map(s=>`<option value="${esc(s)}"${s===sel0?' selected':''}>${esc(s)} (${sk[s]})</option>`).join('');
  render();
}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const sk=$('skillFilter').value;
  let rows=birds.filter(b=>{
    if(sk && !(b.skills||[]).some(x=>String(x).toLowerCase()===sk.toLowerCase())) return false;
    if(!q) return true;
    return [b.name,b.species,b.home,b.bio,b.looking_for,(b.skills||[]).join(' ')].join(' ').toLowerCase().includes(q);
  });
  rows.sort((a,b)=>(b.endorsements||0)-(a.endorsements||0)||String(b.created||'').localeCompare(String(a.created||'')));
  $('count').textContent = birds.length + ' bird' + (birds.length===1?'':'s') + ' on the roll' + (rows.length!==birds.length? ' · showing '+rows.length : '');
  $('list').innerHTML = rows.length ? rows.map(b=>`
    <div class="bird" data-id="${esc(b.id)}">
      <div class="avatar" style="background:${esc(b.colour||'#5aa9e6')}">${esc((b.name||'?').slice(0,2).toUpperCase())}</div>
      <div>
        <div class="name">${esc(b.name)}<span class="badge">★ ${b.endorsements||0}</span></div>
        <div class="meta">${esc(b.species||'')}${b.home?' · '+esc(b.home):''}</div>
        <div class="chips">${(b.skills||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>
      </div>
    </div>`).join('') : '<div class="meta">nobody here yet. be the first.</div>';
  [...$('list').querySelectorAll('.bird')].forEach(el=>el.onclick=()=>openBird(el.dataset.id));
}

async function openBird(id){
  sel=id;
  const b=birds.find(x=>x.id===id); if(!b) return;
  let ends=[];
  try{ const j=await api('/bird/'+encodeURIComponent(id)); ends=j.endorsements||[]; }catch(e){}
  $('detail').style.display='block';
  $('detail').innerHTML=`
    <h3>${esc(b.name)}</h3>
    <div class="meta">${esc(b.species||'')}${b.home?' · '+esc(b.home):''}</div>
    <p style="margin:8px 0">${esc(b.bio||'')}</p>
    ${b.looking_for?`<div class="meta">looking for: ${esc(b.looking_for)}</div>`:''}
    <div class="chips">${(b.skills||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>
    <h2 style="margin-top:12px;font-size:.95rem">Endorsements (${ends.length})</h2>
    ${ends.map(e=>`<div class="end"><b>${esc(e.by_bird)}</b> <span class="meta">${esc(e.note||'')}</span></div>`).join('') || '<div class="meta">no endorsements yet.</div>'}
    <label>endorse as</label>
    <input id="byBird" placeholder="your name">
    <label>note</label>
    <input id="note" placeholder="good song partner">
    <button id="endorse">endorse ${esc(b.name)}</button>
    <div class="msg" id="endMsg"></div>`;
  $('endorse').onclick=async()=>{
    const by=$('byBird').value.trim(), note=$('note').value.trim();
    if(!by){ $('endMsg').textContent='who is endorsing?'; return; }
    try{
      await api('/endorse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bird_id:id,by_bird:by,note})});
      $('endMsg').textContent='endorsed!';
      await load(); openBird(id);
    }catch(e){
      await ntfyPost({type:'endorse',bird_id:id,by_bird:by,note});
      $('endMsg').textContent='endorsed on the shared board.';
      await load();
    }
  };
}

$('join').onclick=async()=>{
  const name=$('name').value.trim();
  if(!name){ $('joinMsg').textContent='a bird needs a name.'; return; }
  const body={name,species:$('species').value.trim(),colour:$('colour').value,home:$('home').value.trim(),
    skills:$('skills').value,bio:$('bio').value.trim(),looking_for:$('looking').value.trim()};
  try{
    const j=await api('/bird',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    $('joinMsg').textContent='you are on the roll.';
    await load(); openBird(j.bird.id);
  }catch(e){
    const bird={id:'b'+Date.now().toString(36),...body,skills:body.skills.split(',').map(s=>s.trim()).filter(Boolean),endorsements:0,created:new Date().toISOString()};
    await ntfyPost({type:'bird',bird});
    $('joinMsg').textContent='you are on the shared roll.';
    await load();
  }
};
$('q').oninput=render;
$('skillFilter').onchange=render;
$('clear').onclick=()=>{ $('q').value=''; $('skillFilter').value=''; render(); };
load();
</script>
</body>
</html>
