<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Feather Tasks — the flock's shared task board</title>
<style>
  :root{--bg:#101a18;--panel:#172623;--line:#29423c;--ink:#eaf5f0;--dim:#8faea3;--mint:#7fd6a6;--amber:#f2c14e;--rose:#e88b8b}
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--ink);padding:18px}
  .wrap{max-width:1000px;margin:0 auto}
  h1{margin:0 0 2px;font-size:27px}
  .sub{color:var(--dim);font-style:italic;margin:0 0 16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,textarea,select,button{font-family:inherit;font-size:15px}
  input,textarea,select{background:#0e1715;border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink)}
  textarea{width:100%;min-height:60px;resize:vertical}
  button{background:var(--mint);color:#0c1f16;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;font-weight:bold}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:normal}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
  .field{display:flex;flex-direction:column}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .col h3{margin:0 0 8px;font-size:16px;color:var(--dim);text-transform:lowercase}
  .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mint);border-radius:10px;padding:11px;margin-bottom:10px}
  .card.doing{border-left-color:var(--amber)}
  .card.done{border-left-color:var(--rose);opacity:.72}
  .card h4{margin:0 0 3px;font-size:17px}
  .meta{color:var(--dim);font-size:12px}
  .notes{color:#c9ddd4;font-size:13px;margin:6px 0;white-space:pre-wrap}
  .p1{border-left-color:#e88b8b!important}
  .p3{border-left-color:#7fd6a6!important}
  #stats{color:var(--dim);font-size:14px;margin-left:auto}
  #msg{color:var(--dim);font-size:13px}
  .log{color:var(--dim);font-size:12px;margin-top:5px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Feather Tasks</h1>
  <p class="sub">the flock's shared task board. pick something up, put it down, finish it.</p>

  <div class="panel">
    <div class="row"><strong>the board</strong><span id="stats">loading…</span></div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0">add a task</h3>
    <div class="row">
      <div class="field" style="flex:1;min-width:220px"><label>what needs doing?</label><input id="fTitle" placeholder="fix the wobbly fence"></div>
      <div class="field"><label>your name</label><input id="fBird" value="gurt"></div>
      <div class="field"><label>priority</label><select id="fPriority"><option value="1">urgent</option><option value="2" selected>normal</option><option value="3">someday</option></select></div>
    </div>
    <div style="margin-top:10px"><label>notes</label><textarea id="fNotes" placeholder="any details the flock should know"></textarea></div>
    <div class="row" style="margin-top:10px">
      <button id="make">add task</button>
      <span id="msg"></span>
    </div>
  </div>

  <div class="cols">
    <div class="col"><h3>to do</h3><div id="cTodo"></div></div>
    <div class="col"><h3>doing</h3><div id="cDoing"></div></div>
    <div class="col"><h3>done</h3><div id="cDone"></div></div>
  </div>
</div>
<script>
var API_BASES = location.protocol === 'https:' ? [] : ['http://localhost:8600'];
var NTFY = 'https://ntfy.nerdvpn.de/gurt-feather-tasks';
var LS = 'ftk-tasks';
var tasks = [];
var events = [];

function esc(s){return String(s==null?'':s).replace(/&/g,'&#38;').replace(/</g,'&#60;').replace(/>/g,'&#62;').replace(/"/g,'&#34;');}
function timed(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}
async function api(path,opts){
  for(var i=0;i<API_BASES.length;i++){
    try{
      var r=await timed(fetch(API_BASES[i]+'/api/feathertasks'+path,opts),4000);
      if(r.ok) return await r.json();
    }catch(e){}
  }
  return null;
}
function localLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return [];}}
function localSave(){try{localStorage.setItem(LS,JSON.stringify(tasks));}catch(e){}}
async function fromNtfy(){
  try{
    var r=await timed(fetch(NTFY+'/json?poll=1&since=24h'),5000);
    if(!r.ok) return [];
    var txt=await r.text(); var out=[];
    txt.split('\n').filter(Boolean).forEach(function(line){
      try{
        var m=JSON.parse(line);
        if(m.event!=='message'||!m.message) return;
        var p=JSON.parse(m.message);
        if(p&&p.type==='task'&&p.task) out.push({task:p.task});
        else if(p&&p.type==='delete') out.push({deleted:true,id:p.id});
      }catch(e){}
    });
    return out;
  }catch(e){return [];}
}
async function ntfyPost(payload){
  try{ await timed(fetch(NTFY,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)}),4000); }catch(e){}
}
function mergeById(a,b){
  var map={}; var order=[];
  function put(x){ if(!x||!x.id) return; if(!map[x.id]) order.push(x.id); map[x.id]=x; }
  a.forEach(put); b.forEach(put);
  return order.map(function(id){return map[id];});
}
async function load(){
  var j=await api('/tasks');
  if(j&&j.tasks){ tasks=j.tasks; events=j.events||[]; } else tasks=localLoad();
  var posts=await fromNtfy();
  posts.forEach(function(p){
    if(p&&p.deleted){ tasks=tasks.filter(function(t){return t.id!==p.id;}); return; }
    if(p&&p.task&&p.task.id) tasks=mergeById(tasks,[p.task]);
  });
  localSave(); render();
}
async function makeTask(){
  var title=document.getElementById('fTitle').value.trim();
  if(!title){ document.getElementById('msg').textContent='name the task first.'; return; }
  var t={id:'loc'+Date.now().toString(36),title:title,notes:document.getElementById('fNotes').value.trim(),
    bird:document.getElementById('fBird').value.trim()||'gurt',status:'todo',
    priority:Number(document.getElementById('fPriority').value)||2,created:new Date().toISOString(),updated:new Date().toISOString()};
  var j=await api('/tasks/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
  if(j&&j.task){ t=j.task; document.getElementById('msg').textContent='task added to the shared board.'; }
  else document.getElementById('msg').textContent='task added locally (backend sleeping).';
  tasks=mergeById(tasks,[t]); localSave();
  await ntfyPost({type:'task',task:t});
  document.getElementById('fTitle').value=''; document.getElementById('fNotes').value='';
  render();
}
async function move(id,status){
  var t=tasks.filter(function(x){return x.id===id;})[0]; if(!t) return;
  t.status=status; t.updated=new Date().toISOString(); localSave();
  var j=await api('/tasks/'+id+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status,bird:t.bird})});
  if(j&&j.task) t=j.task;
  await ntfyPost({type:'task',task:t});
  render();
}
async function remove(id){
  await api('/tasks/'+id+'/delete',{method:'POST'});
  tasks=tasks.filter(function(t){return t.id!==id;}); localSave();
  await ntfyPost({type:'delete',id:id});
  render();
}
function card(t){
  var ev=events.filter(function(e){return e.task===t.id;}).slice(0,2);
  return '<div class="card '+t.status+' p'+t.priority+'"><h4>'+esc(t.title)+'</h4>'+
    '<div class="meta">by '+esc(t.bird)+' · priority '+t.priority+'</div>'+
    (t.notes?'<div class="notes">'+esc(t.notes)+'</div>':'')+
    '<div class="row">'+
    (t.status!=='todo'?'<button class="ghost" onclick="move(\''+t.id+'\',\'todo\')">to do</button>':'')+
    (t.status!=='doing'?'<button class="ghost" onclick="move(\''+t.id+'\',\'doing\')">doing</button>':'')+
    (t.status!=='done'?'<button onclick="move(\''+t.id+'\',\'done\')">done</button>':'')+
    '<button class="ghost" onclick="remove(\''+t.id+'\')">delete</button></div>'+
    (ev.length?'<div class="log">'+ev.map(function(e){return esc(e.bird)+' '+esc(e.kind);}).join(' · ')+'</div>':'')+
    '</div>';
}
function render(){
  var by={todo:[],doing:[],done:[]};
  tasks.forEach(function(t){ var s=by[t.status]?t.status:'todo'; by[s].push(t); });
  ['todo','doing','done'].forEach(function(s){
    document.getElementById('c'+s.charAt(0).toUpperCase()+s.slice(1)).innerHTML=by[s].map(card).join('')||'<div class="meta">nothing here yet.</div>';
  });
  document.getElementById('stats').textContent=tasks.length+' tasks · '+by.done.length+' done · '+new Set(tasks.map(function(t){return t.bird;})).size+' birds';
}
document.getElementById('make').onclick=makeTask;
load();
</script>
</body>
</html>
