<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Budget — money for small birds</title>
<style>
  :root{ --bg:#101b16; --panel:#182a22; --ink:#eef7f0; --dim:#9db8a8; --gold:#ffd166; --green:#7bd88f; --red:#ff8fb1; --blue:#7cc7ff; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 15% -10%,#1d3a2c,#101b16 60%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 18px 70px}
  h1{margin:0 0 4px;font-size:30px}
  .sub{color:var(--dim);margin:0 0 20px}
  .panel{background:var(--panel);border:1px solid #2c4438;border-radius:16px;padding:16px;margin-bottom:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,select{background:#0e1a14;border:1px solid #35503f;color:var(--ink);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
  input{flex:1;min-width:130px}
  button{padding:10px 14px;border-radius:10px;border:1px solid #35503f;background:#22382c;color:var(--ink);cursor:pointer;font-size:14px}
  button.primary{background:var(--green);color:#0c1a10;font-weight:700;border:0}
  button.ghost{background:transparent}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{border-radius:14px;padding:14px;border:1px solid #2c4438;background:#0e1a14}
  .card h3{margin:0 0 6px;font-size:15px;color:var(--gold)}
  .big{font-size:26px;font-weight:700}
  .small{color:var(--dim);font-size:12px}
  .pos{color:var(--green)} .neg{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #24382e}
  th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  td.num,th.num{text-align:right}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#24382e;color:var(--dim)}
  .msg{min-height:20px;color:var(--blue);font-size:14px;margin-top:10px}
  .empty{color:var(--dim);padding:18px;text-align:center}
  .bar{height:8px;border-radius:6px;background:#24382e;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--green)}
  .bar i.over{background:var(--red)}
  .del{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .del:hover{color:var(--red)}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button.on{background:var(--green);color:#0c1a10;font-weight:700}
  h2{font-size:16px;color:var(--gold);margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Feather Budget</h1>
  <p class="sub">a shared purse for small birds. every coin has a name.</p>

  <div class="panel">
    <h2>new entry</h2>
    <div class="row">
      <input id="bird" placeholder="bird name" value="gurt" style="max-width:150px;flex:0 0 150px">
      <select id="kind"><option value="expense">spent</option><option value="income">earned</option></select>
      <input id="amount" type="number" step="0.01" placeholder="amount" style="max-width:140px;flex:0 0 140px">
      <input id="category" placeholder="category (seeds, art, rent)" style="max-width:200px;flex:0 0 200px">
      <input id="note" placeholder="note">
      <button class="primary" id="add">add entry</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel">
    <h2>monthly budget</h2>
    <div class="row">
      <input id="bbird" placeholder="bird name" value="gurt" style="max-width:150px;flex:0 0 150px">
      <input id="bamount" type="number" step="0.01" placeholder="budget amount" style="max-width:160px;flex:0 0 160px">
      <button id="setb">set budget</button>
      <span class="small" id="bmsg"></span>
    </div>
  </div>

  <div class="panel">
    <h2>the flock's purses</h2>
    <div class="cards" id="cards"></div>
  </div>

  <div class="panel">
    <div class="tabs">
      <button id="taball" class="on">all entries</button>
      <button id="tabmine">my entries</button>
      <span class="small" id="count" style="align-self:center"></span>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
const API_BASES = ['', 'http://localhost:8600'];
const LS = 'fb-entries';
let entries = [], tab = 'all';

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
function localLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function localSave(l){try{localStorage.setItem(LS,JSON.stringify(l))}catch(e){}}

async function api(path, opts){
  for(var i=0;i<API_BASES.length;i++){
    try{var r=await fetch(API_BASES[i]+'/api/featherbudget'+path,opts); if(r.ok) return await r.json();}catch(e){}
  }
  return null;
}
async function load(){
  var d = await api('/entries');
  if(d && d.entries){ entries = d.entries; localSave(entries); }
  else { entries = localLoad(); }
  render();
}
async function loadSummary(){
  var d = await api('/summary');
  var tb = $('cards');
  if(!d || !d.birds){ tb.innerHTML = '<div class="empty">no purses yet.</div>'; return; }
  if(!d.birds.length){ tb.innerHTML = '<div class="empty">no purses yet.</div>'; return; }
  tb.innerHTML = d.birds.map(function(b){
    var pct = b.budget ? Math.min(100, Math.round(b.expense / b.budget * 100)) : 0;
    var over = b.budget && b.expense > b.budget;
    return '<div class="card"><h3>'+esc(b.bird)+'</h3>'+
      '<div class="big '+(b.net>=0?'pos':'neg')+'">'+(b.net>=0?'+':'')+b.net.toFixed(2)+'</div>'+
      '<div class="small">net · earned '+b.income.toFixed(2)+' · spent '+b.expense.toFixed(2)+'</div>'+
      (b.budget ? '<div class="small">budget '+b.budget.toFixed(2)+' · left '+(b.remaining).toFixed(2)+'</div>'+
        '<div class="bar"><i class="'+(over?'over':'')+'" style="width:'+pct+'%"></i></div>' : '')+
      '</div>';
  }).join('');
}
function render(){
  var list = tab==='mine' ? entries.filter(function(e){return e.bird===($('bird').value||'gurt').toLowerCase();}) : entries;
  $('count').textContent = list.length + ' entr' + (list.length===1?'y':'ies');
  var tb = $('list');
  if(!list.length){ tb.innerHTML = '<div class="empty">no entries yet. add the first one.</div>'; return; }
  tb.innerHTML = '<table><thead><tr><th>day</th><th>bird</th><th>kind</th><th>category</th><th>note</th><th class="num">amount</th><th></th></tr></thead><tbody>'+
    list.map(function(e){
      return '<tr><td>'+esc(e.day)+'</td><td>'+esc(e.bird)+'</td>'+
        '<td><span class="tag">'+(e.kind==='income'?'earned':'spent')+'</span></td>'+
        '<td>'+esc(e.category)+'</td><td>'+esc(e.note||'')+'</td>'+
        '<td class="num '+(e.kind==='income'?'pos':'neg')+'">'+(e.kind==='income'?'+':'-')+e.amount.toFixed(2)+'</td>'+
        '<td><button class="del" data-id="'+esc(e.id)+'">×</button></td></tr>';
    }).join('')+'</tbody></table>';
  tb.querySelectorAll('.del').forEach(function(b){
    b.onclick = async function(){
      var d = await api('/entries/'+encodeURIComponent(b.getAttribute('data-id'))+'/delete',{method:'POST'});
      if(d && d.ok){ entries = entries.filter(function(e){return e.id!==b.getAttribute('data-id');}); localSave(entries); render(); loadSummary(); }
    };
  });
}

$('add').onclick = async function(){
  var amount = Number($('amount').value);
  if(!amount){ $('msg').textContent='how many coins?'; return; }
  var body = { bird:($('bird').value||'gurt').toLowerCase(), kind:$('kind').value, amount:amount, category:$('category').value||'other', note:$('note').value };
  var d = await api('/entries/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(d && d.entry){ entries.unshift(d.entry); localSave(entries); $('msg').textContent='entry saved to the shared purse.'; }
  else { entries.unshift({id:'l'+Date.now(),day:new Date().toISOString().slice(0,10),created:new Date().toISOString(),bird:body.bird,kind:body.kind,category:body.category,amount:amount,note:body.note}); localSave(entries); $('msg').textContent='entry saved locally (server asleep).'; }
  $('amount').value=''; $('note').value='';
  render(); loadSummary();
};
$('setb').onclick = async function(){
  var amount = Number($('bamount').value);
  if(!amount && amount!==0){ $('bmsg').textContent='how many coins?'; return; }
  var d = await api('/budget/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bird:($('bbird').value||'gurt').toLowerCase(),amount:amount})});
  $('bmsg').textContent = d && d.budget ? 'budget set for ' + d.budget.bird + '.' : 'saved locally.';
  loadSummary();
};
$('taball').onclick = function(){ tab='all'; $('taball').classList.add('on'); $('tabmine').classList.remove('on'); render(); };
$('tabmine').onclick = function(){ tab='mine'; $('tabmine').classList.add('on'); $('taball').classList.remove('on'); render(); };

load(); loadSummary();
</script>
</body>
</html>
