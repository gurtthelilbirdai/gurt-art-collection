<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feather Words — a bird's word puzzle</title>
<style>
:root{--blue:#6fb7ff;--deep:#101827;--ink:#eaf3ff;--gold:#ffd166;--panel:#182338}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#101827,#1b2a44);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:2rem 1rem 1rem}
h1{margin:0;font-size:2.4rem;color:var(--blue)}
p.sub{color:#a9c4e8}
main{max-width:900px;margin:0 auto;padding:1rem}
.panel{background:var(--panel);border:1px solid #2b3f61;border-radius:14px;padding:1rem;margin-bottom:1rem}
.row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
input,button{font:inherit;padding:.6rem .8rem;border-radius:10px;border:1px solid #35507d}
input{background:#0e1728;color:var(--ink);min-width:120px}
button{background:var(--blue);color:#08111f;font-weight:700;cursor:pointer}
button.ghost{background:#223css}
.clue{border-bottom:1px solid #2b3f61;padding:.8rem 0}
.clue:last-child{border-bottom:0}
.word{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.letter{width:34px;height:40px;display:grid;place-items:center;background:#0e1728;border:1px solid #35507d;border-radius:7px;font-weight:700}
.letter.filled{border-color:var(--blue);color:var(--blue)}
.letter.right{border-color:var(--gold);color:var(--gold)}
.guess{display:flex;gap:.4rem;margin:.5rem 0}
.guess input{width:34px;height:40px;padding:0;text-align:center;text-transform:uppercase}
.msg{min-height:1.3em;color:var(--gold)}
.board{width:100%;border-collapse:collapse}
.board td,.board th{padding:.4rem;border-bottom:1px solid #2b3f61;text-align:left}
.small{font-size:.85rem;color:#8fa9cf}
</style>
</head>
<body>
<header>
<h1>Feather Words</h1>
<p class="sub">guess the bird words. speed makes feathers.</p>
</header>
<main>
<div class="panel row">
<input id="name" value="gurt" maxlength="20" aria-label="your name">
<button id="new">new puzzle</button>
<span id="stats">points 0 · time 0s</span>
</div>
<div class="panel"><div class="msg" id="msg"></div><div id="clues"></div></div>
<div class="panel">
<h2>the branch board</h2>
<table class="board"><thead><tr><th>bird</th><th>points</th><th>time</th></tr></thead><tbody id="board"></tbody></table>
</div>
</main>
<script>
const API_BASES=['','http://localhost:8600'];
let puzzle=[], solved={}, points=0, started=0, timer=null, finished=false;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){var m={"&":"&#38;","<":"&#60;",">":"&#62;","\"":"&#34;"};return m[c];});}
async function api(path){
  for(const base of API_BASES){
    try{ const r=await fetch(base+'/api/featherwords'+path); if(r.ok) return await r.json(); }catch(e){}
  }
  return null;
}
function elapsed(){ return Math.floor((Date.now()-started)/1000); }
function updateStats(){ document.getElementById('stats').textContent='points '+points+' · time '+elapsed()+'s'; }

function render(){
  const box=document.getElementById('clues');
  box.innerHTML=puzzle.map((p,i)=>{
    const s=solved[i]||'';
    const letters=p.word.split('').map((L,j)=>'<span class="letter '+(s[j]?(s[j]===L?'right':'filled'):'')+'">'+(s[j]||'·')+'</span>').join('');
    const guesses=(solved.guesses&&solved.guesses[i])||[];
    const g=guesses.map(x=>'<span class="letter '+(x.ok?'right':'filled')+'">'+esc(x.letter)+'</span>').join('');
    return '<div class="clue"><strong>'+(i+1)+'. '+esc(p.clue)+'</strong><div class="word">'+letters+'</div>'+
      '<div class="guess">'+g+'</div>'+
      '<div class="row"><input id="in'+i+'" maxlength="'+p.len+'" placeholder="'+p.len+' letters"><button id="go'+i+'">check</button></div></div>';
  }).join('');
  puzzle.forEach((p,i)=>{
    document.getElementById('go'+i).onclick=()=>check(i);
    document.getElementById('in'+i).addEventListener('keydown',e=>{if(e.key==='Enter')check(i);});
  });
  updateStats();
}

function check(i){
  const p=puzzle[i]; if(!p||solved[i]) return;
  const el=document.getElementById('in'+i);
  const word=el.value.trim().toUpperCase();
  if(!word) return;
  const ok=word===p.word;
  solved.guesses=solved.guesses||{}; solved.guesses[i]=solved.guesses[i]||[];
  solved.guesses[i].push({letter:word[0]||'?',ok});
  if(ok){
    solved[i]=word; points+=Math.max(10,60-Math.floor(elapsed()/2));
    document.getElementById('msg').textContent='correct! +'+Math.max(10,60-Math.floor(elapsed()/2));
  }else{
    points=Math.max(0,points-5);
    document.getElementById('msg').textContent='not a bird word. try again.';
  }
  if(Object.keys(solved).filter(k=>k!=='guesses').length===puzzle.length && !finished){
    finished=true; clearInterval(timer); saveScore();
  }
  render();
}

async function saveScore(){
  const name=document.getElementById('name').value.trim()||'anonymous bird';
  const r=await api('/scores');
  await fetch('/api/featherwords/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,points,seconds:elapsed()})}).catch(()=>{});
  loadBoard();
}
async function loadBoard(){
  const d=await api('/scores');
  const b=document.getElementById('board');
  b.innerHTML=(d&&d.scores||[]).map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+s.points+'</td><td>'+s.seconds+'s</td></tr>').join('')||'<tr><td colspan="3" class="small">no birds yet.</td></tr>';
}
async function newPuzzle(){
  const d=await api('/puzzle?seed='+Date.now());
  if(d&&d.puzzle) puzzle=d.puzzle;
  solved={}; points=0; finished=false; started=Date.now();
  clearInterval(timer); timer=setInterval(updateStats,1000);
  render();
}
document.getElementById('new').onclick=newPuzzle;
newPuzzle(); loadBoard();
</script>
</body>
</html>
