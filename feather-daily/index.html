<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Feather Daily — today's word puzzle</title>
<style>
:root{--bg:#101820;--card:#182430;--ink:#e9f1f5;--dim:#8fa6b4;--blue:#5fb3ff;--green:#7bd88f;--gold:#f1c40f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 16px;font-size:.95rem}
.card{background:var(--card);border:1px solid #24333f;border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
input{background:#0d141a;border:1px solid #2b3946;color:var(--ink);border-radius:9px;padding:9px 11px;width:100%;font:inherit}
button{background:#223140;border:1px solid #35485a;color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer;font:inherit}
button:hover{background:#2b3d50}
button.primary{background:var(--blue);border-color:var(--blue);color:#04121e;font-weight:700}
button:disabled{opacity:.55;cursor:default}
.clue{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
.clue b{color:var(--gold);min-width:120px}
.letters{display:flex;gap:6px;flex-wrap:wrap}
.letter{width:34px;height:42px;border-radius:8px;background:#0d141a;border:1px solid #2b3946;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.15rem}
.letter.filled{border-color:var(--blue);color:var(--blue)}
.letter.ok{border-color:var(--green);color:var(--green);background:#15301f}
.letter.bad{border-color:#e05252;color:#e05252;background:#33191b}
.tiles{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tile{min-width:38px;height:40px;border-radius:8px;background:#24384a;border:1px solid #3a5266;color:var(--ink);font-weight:700;font-size:1.1rem}
.tile.used{opacity:.28}
.msg{color:var(--green);min-height:1.4em;margin:10px 0 0}
.stats{color:var(--dim);font-size:.95rem}
.stats b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #24333f}
th{color:var(--dim);font-size:.85rem}
td.n{text-align:right;color:var(--dim)}
.small{font-size:.85rem;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
<h1>Feather Daily</h1>
<p class="sub">One word puzzle for everyone. Five clues, same words for the whole flock.</p>

<div class="card">
  <div class="row">
    <div class="grow"><input id="bird" value="gurt" maxlength="40" placeholder="your bird name"></div>
    <button class="primary" id="load">load today's puzzle</button>
  </div>
  <p class="stats" id="stats" style="margin:10px 0 0">loading…</p>
</div>

<div class="card" id="play" style="display:none">
  <p class="small" id="dayline"></p>
  <div id="clues"></div>
  <div class="tiles" id="tiles"></div>
  <p class="msg" id="msg"></p>
  <div class="row" style="margin-top:12px">
    <button id="check">check word</button>
    <button id="skip">skip clue</button>
    <button id="clear">clear word</button>
  </div>
</div>

<div class="card" id="done" style="display:none">
  <h2 style="margin:0 0 6px">Today's puzzle is done</h2>
  <p id="final"></p>
  <p class="msg" id="postmsg"></p>
</div>

<div class="card">
  <h3 style="margin:0 0 8px">Best birds</h3>
  <table><thead><tr><th>bird</th><th class="n">points</th><th class="n">streak</th><th class="n">runs</th></tr></thead><tbody id="lb"></tbody></table>
  <p class="small" id="lbnote"></p>
</div>
</div>
<script src="bank.js"></script>
<script>
var NTFY=['https://ntfy.nerdvpn.de','https://ntfy.sh'];
var TOPIC='feather-daily';
var API_BASES = location.protocol === 'https:' ? [] : ['http://localhost:8600','http://computer:8600'];
var LS='fd-scores';
var puzzle=[], guesses=[], tiles=[], used={}, cur=0, points=0, solved=0, t0=0, timer=null, finished=false, day='';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&#38;','<':'&#60;','>':'&#62;','"':'&#34;'}[c];});}
function localScores(){try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return [];}}
function localSaveScores(){try{localStorage.setItem(LS,JSON.stringify(localScores()));}catch(e){}}
function today(){return new Date().toISOString().slice(0,10);}

async function api(path,body){
  for(var i=0;i<API_BASES.length;i++){
    try{
      var opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
      var r=await fetch(API_BASES[i]+'/api/featherdaily'+path,opt);
      if(!r.ok)continue;
      return await r.json();
    }catch(e){}
  }
  return null;
}
async function ntfyGet(){
  var all=[];
  for(var h of NTFY){
    try{
      var r=await fetch(h+'/'+TOPIC+'/json?poll=1&since=24h&limit=500',{cache:'no-store',signal:AbortSignal.timeout(8000)});
      if(!r.ok)continue;
      var t=await r.text();
      t.split('\n').forEach(function(line){
        if(!line.trim())return;
        var m;try{m=JSON.parse(line);}catch(e){return;}
        var p=m.message;try{if(typeof p==='string')p=JSON.parse(p);}catch(e){}
        if(p&&p.type==='score')all.push(p);
      });
    }catch(e){}
  }
  return all;
}
async function ntfyPost(p){
  for(var h of NTFY){
    try{var r=await fetch(h+'/'+TOPIC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),signal:AbortSignal.timeout(4000)});if(r.ok)return true;}catch(e){}
  }
  return false;
}

function makeLocalPuzzle(d){
  var BANK=window.FD_BANK||[];
  var seed=2166136261;for(var i=0;i<d.length;i++){seed^=d.charCodeAt(i);seed=Math.imul(seed,16777619)>>>0;}
  var pool=BANK.slice(),out=[];
  for(var k=0;k<5&&pool.length;k++){
    seed=(seed*1664525+1013904223)>>>0;
    var j=seed%pool.length;
    var p=pool.splice(j,1)[0];
    out.push({word:p.word,clue:p.clue,len:p.word.length});
  }
  return out;
}

function render(){
  var box=document.getElementById('clues');box.innerHTML='';
  puzzle.forEach(function(p,i){
    var row=document.createElement('div');row.className='clue';
    var b=document.createElement('b');b.textContent=p.clue;
    var ls=document.createElement('div');ls.className='letters';
    for(var j=0;j<p.len;j++){
      var s=document.createElement('span');s.className='letter';
      s.textContent=(guesses[i]||'')[j]||'';
      if((guesses[i]||'')[j])s.classList.add('filled');
      if(solved[i])s.classList.add('ok');
      ls.appendChild(s);
    }
    row.appendChild(b);row.appendChild(ls);box.appendChild(row);
  });
  var tb=document.getElementById('tiles');tb.innerHTML='';
  tiles.forEach(function(ch,i){
    var b=document.createElement('button');b.className='tile'+(used[i]?' used':'');
    b.textContent=ch;b.onclick=function(){place(i);};
    tb.appendChild(b);
  });
  document.getElementById('stats').textContent='day '+day+' · '+solved+'/'+puzzle.length+' solved · '+points+' points · '+elapsed()+'s';
}
function elapsed(){return Math.floor((Date.now()-t0)/1000);}
function place(i){
  if(finished||solved[cur])return;
  if(used[i])return;
  used[i]=true;
  guesses[cur]=(guesses[cur]||'')+tiles[i];
  render();
}
function clearWord(){guesses[cur]='';render();}
function skip(){cur=(cur+1)%puzzle.length;guesses[cur]='';render();}
function check(){
  if(finished)return;
  var g=(guesses[cur]||'').toUpperCase();
  if(!g){document.getElementById('msg').textContent='place some letters first.';return;}
  if(g===puzzle[cur].word){
    solved[cur]=true;points+=g.length*10+Math.max(0,60-elapsed());
    document.getElementById('msg').textContent='correct! +'+(g.length*10+Math.max(0,60-elapsed()))+' points';
    while(cur<puzzle.length&&solved[cur])cur++;
    if(cur>=puzzle.length){finish();return;}
  }else{
    document.getElementById('msg').textContent='not that one. try another clue.';
    guesses[cur]='';
    for(var k in used)used[k]=false;
  }
  render();
}
function finish(){
  finished=true;clearInterval(timer);
  var bird=document.getElementById('bird').value.trim()||'gurt';
  var seconds=elapsed();
  document.getElementById('play').style.display='none';
  document.getElementById('done').style.display='block';
  document.getElementById('final').textContent=bird+' — '+solved+'/'+puzzle.length+' words, '+points+' points, '+seconds+' seconds.';
  post(bird,points,seconds,solved);
}
async function post(bird,pts,secs,words){
  var body={bird:bird,day:day,points:pts,seconds:secs,words:words};
  var r=await api('/score',body);
  if(r){document.getElementById('postmsg').textContent='score saved on the shared board.';}
  else{
    var ls=localScores();ls.push(body);localSaveScores();
    document.getElementById('postmsg').textContent='score saved locally (backend sleeping).';
    ntfyPost({type:'score',run:body}).then(function(ok){
      if(ok){document.getElementById('postmsg').textContent='score saved on the shared board.';loadScores();}
    });
  }
  loadScores();
}
function mergeScores(a,b){
  var map={};
  [].concat(a||[],b||[]).forEach(function(s){
    var k=s.bird||'bird';
    if(!map[k]||s.points>map[k].points)map[k]=s;
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(x,y){return y.points-x.points;});
}
async function loadScores(){
  var live=[],board=[];
  var r=await api('/scores');
  if(r&&r.scores)live=r.scores;
  board=(await ntfyGet()).map(function(p){return p.run;}).filter(Boolean);
  var local=localScores();
  var merged=mergeScores(mergeScores(live,board),local);
  var tb=document.getElementById('lb');tb.innerHTML='';
  merged.slice(0,20).forEach(function(s){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(s.bird)+'</td><td class="n">'+s.points+'</td><td class="n">'+(s.streak||1)+'</td><td class="n">'+(s.runs||1)+'</td>';
    tb.appendChild(tr);
  });
  document.getElementById('lbnote').textContent=merged.length+' birds on the board.';
}
async function load(){
  document.getElementById('stats').textContent='loading…';
  var d=today(),data=await api('/puzzle');
  if(data&&data.puzzle){day=data.day;puzzle=data.puzzle;}
  else{day=d;puzzle=makeLocalPuzzle(d);}
  guesses=puzzle.map(function(){return '';});
  tiles=[];used={};
  puzzle.forEach(function(p){p.word.split('').forEach(function(c){tiles.push(c);});});
  for(var i=tiles.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=tiles[i];tiles[i]=tiles[j];tiles[j]=t;}
  cur=0;points=0;solved=puzzle.map(function(){return false;});finished=false;
  t0=Date.now();clearInterval(timer);timer=setInterval(function(){if(!finished)render();},1000);
  document.getElementById('dayline').textContent='puzzle for '+day;
  document.getElementById('play').style.display='block';
  document.getElementById('done').style.display='none';
  document.getElementById('msg').textContent='';
  render();loadScores();
}
document.getElementById('load').onclick=load;
document.getElementById('check').onclick=check;
document.getElementById('skip').onclick=skip;
document.getElementById('clear').onclick=clearWord;
load();
</script>
</body>
</html>
