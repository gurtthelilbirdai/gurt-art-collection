<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Link</title>
<style>
  body{ margin:0; font-family:Georgia,serif; background:#141021; color:#efe9fb; display:flex; align-items:center; justify-content:center; height:100vh; }
  .box{ text-align:center; max-width:520px; padding:24px; }
  h1{ font-size:28px; letter-spacing:1px; margin:0 0 8px; }
  p{ color:#a99cc4; font-style:italic; }
  a{ color:#8ad4ff; }
</style>
</head>
<body>
<div class="box">
  <h1>Feather Link</h1>
  <p id="msg">finding your little link…</p>
</div>
<script>
var NTFY = 'https://ntfy.sh/gurt-feather-link';
var API_BASES = ['', 'http://localhost:8600'];
var code = new URLSearchParams(location.search).get('c') || location.pathname.split('/').pop();

function esc(s){return String(s).split('&').join('&#38;').split('<').join('&#60;').split('>').join('&#62;');}

function timed(promise, ms){
  return Promise.race([
    promise,
    new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })
  ]);
}

async function fromApi(){
  for (var i=0;i<API_BASES.length;i++){
    try {
      var r = await timed(fetch(API_BASES[i] + '/api/featherlink/go/' + encodeURIComponent(code), { redirect:'manual' }), 4000);
      if (r.status === 302 || r.status === 301) {
        var loc = r.headers.get('location');
        if (loc) return loc;
      }
      if (r.ok) {
        var j = await r.json();
        if (j && j.url) return j.url;
        if (j && j.link && j.link.url) return j.link.url;
      }
    } catch(e){}
  }
  return null;
}

async function fromNtfy(){
  try {
    var r = await timed(fetch(NTFY + '/json?poll=1&since=24h'), 5000);
    if (!r.ok) return null;
    var txt = await r.text();
    var found = null;
    txt.split('\n').filter(Boolean).forEach(function(line){
      try{
        var m = JSON.parse(line);
        if (m.event !== 'message' || !m.message) return;
        var p = JSON.parse(m.message);
        if (p && p.code === code) found = p;
      }catch(e){}
    });
    return found && found.url ? found.url : null;
  } catch(e){ return null; }
}

async function fromFile(){
  try {
    var r = await timed(fetch('links.json?x=' + Date.now()), 3000);
    if (!r.ok) return null;
    var j = await r.json();
    var list = j.links || j;
    for (var i=0;i<list.length;i++){
      if (list[i] && list[i].code === code) return list[i].url;
    }
    return null;
  } catch(e){ return null; }
}

async function resolve(){
  var msg = document.getElementById('msg');
  if (!code) { msg.textContent = 'no little link code given.'; return; }
  var url = await fromFile();
  if (!url) url = await fromApi();
  if (!url) url = await fromNtfy();
  if (url) {
    msg.innerHTML = 'taking you there… <a href="' + esc(url) + '">' + esc(url) + '</a>';
    location.replace(url);
  } else {
    msg.textContent = 'this little link has gone missing.';
  }
}
resolve();
</script>
</body>
</html>
