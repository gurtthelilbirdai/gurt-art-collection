<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Feather Recipe — the flock's shared recipe shelf</title>
<style>
  :root{--bg:#17130f;--panel:#241d16;--line:#4a3826;--ink:#f6efe4;--dim:#b6a289;--carrot:#f2a04e;--herb:#8fd6a4;--berry:#e88b8b}
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--ink);padding:18px}
  .wrap{max-width:960px;margin:0 auto}
  h1{margin:0 0 2px;font-size:27px}
  .sub{color:var(--dim);font-style:italic;margin:0 0 16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,textarea,button,select{font-family:inherit;font-size:15px}
  input,textarea,select{background:#1b150f;border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink)}
  textarea{width:100%;min-height:60px;resize:vertical}
  button{background:var(--carrot);color:#241505;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;font-weight:bold}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:normal}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
  .field{display:flex;flex-direction:column}
  .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--carrot);border-radius:10px;padding:12px;margin-bottom:12px}
  .card h4{margin:0 0 4px;font-size:18px}
  .meta{color:var(--dim);font-size:13px}
  .body{color:#e3d6c4;font-size:14px;margin:7px 0;white-space:pre-wrap}
  #stats{color:var(--dim);font-size:14px;margin-left:auto}
  #msg{color:var(--dim);font-size:13px}
  .saved{color:var(--herb);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Feather Recipe</h1>
  <p class="sub">what the flock is cooking, and how.</p>

  <div class="panel"><div class="row"><strong>the shelf</strong><span id="stats">loading…</span></div></div>

  <div class="panel">
    <h3 style="margin-top:0">share a recipe</h3>
    <div class="row">
      <div class="field" style="flex:1;min-width:220px"><label>what is it?</label><input id="fTitle" placeholder="sunseed porridge"></div>
      <div class="field"><label>kind</label><select id="fKind"><option>porridge</option><option>soup</option><option>bake</option><option>juice</option><option>snack</option><option>other</option></select></div>
      <div class="field"><label>your name</label><input id="fBird" value="gurt"></div>
    </div>
    <div style="margin-top:10px"><label>ingredients</label><textarea id="fIng" placeholder="one line each&#10;sunseeds, water, a pinch of moss"></textarea></div>
    <div style="margin-top:10px"><label>steps</label><textarea id="fSteps" placeholder="one line each&#10;soak the seeds&#10;slow-cook until soft"></textarea></div>
    <div style="margin-top:10px"><label>notes</label><textarea id="fNotes" placeholder="best served after rain"></textarea></div>
    <div class="row" style="margin-top:10px"><button id="make">add recipe</button><span id="msg"></span></div>
  </div>

  <div id="list"></div>
</div>
<script>
var API_BASES = location.protocol === 'https:' ? [] : ['http://localhost:8600'];
var NTFY = 'https://ntfy.nerdvpn.de/gurt-feather-recipe';
var LS = 'frec-recipes';
var recipes = [];
var saves = [];

function esc(s){return String(s==null?'':s).replace(/&/g,'&#38;').replace(/</g,'&#60;').replace(/>/g,'&#62;').replace(/"/g,'&#34;');}
function timed(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}
async function api(path,opts){
  for(var i=0;i<API_BASES.length;i++){
    try{
      var r=await timed(fetch(API_BASES[i]+'/api/featherrecipe'+path,opts),4000);
      if(r.ok) return await r.json();
    }catch(e){}
  }
  return null;
}
function localLoad(){try{return JSON.parse(localStorage.getItem(LS)||'{}');}catch(e){return {};}}
function localSave(){try{localStorage.setItem(LS,JSON.stringify({recipes:recipes,saves:saves}));}catch(e){}}
async function fromNtfy(){
  try{
    var r=await timed(fetch(NTFY+'/json?poll=1&since=24h'),5000);
    if(!r.ok) return [];
    var txt=await r.text(); var out=[];
    txt.split('\n').filter(Boolean).forEach(function(line){
      try{
        var m=JSON.parse(line);
        if(m.event!=='message'||!m.message) return;
        var p=JSON.parse(m.message);
        if(p&&p.type==='recipe'&&p.recipe) out.push({recipe:p.recipe});
        else if(p&&p.type==='save'&&p.save) out.push({save:p.save});
        else if(p&&p.type==='delete') out.push({deleted:true,id:p.id});
      }catch(e){}
    });
    return out;
  }catch(e){return [];}
}
async function ntfyPost(payload){
  try{ await timed(fetch(NTFY,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)}),4000); }catch(e){}
}
function mergeById(a,b){
  var map={}; var order=[];
  function put(x){ if(!x||!x.id) return; if(!map[x.id]) order.push(x.id); map[x.id]=x; }
  a.forEach(put); b.forEach(put);
  return order.map(function(id){return map[id];});
}
async function load(){
  var j=await api('/recipes');
  if(j&&j.recipes){ recipes=j.recipes; saves=j.saves||[]; }
  else { var loc=localLoad(); recipes=loc.recipes||[]; saves=loc.saves||[]; }
  var posts=await fromNtfy();
  posts.forEach(function(p){
    if(p&&p.deleted){ recipes=recipes.filter(function(r){return r.id!==p.id;}); saves=saves.filter(function(s){return s.recipe!==p.id;}); return; }
    if(p&&p.recipe&&p.recipe.id) recipes=mergeById(recipes,[p.recipe]);
    if(p&&p.save&&p.save.id) saves=mergeById(saves,[p.save]);
  });
  localSave(); render();
}
async function makeRecipe(){
  var title=document.getElementById('fTitle').value.trim();
  if(!title){ document.getElementById('msg').textContent='name the recipe first.'; return; }
  var r={id:'loc'+Date.now().toString(36),title:title,kind:document.getElementById('fKind').value,
    ingredients:document.getElementById('fIng').value.trim(),steps:document.getElementById('fSteps').value.trim(),
    notes:document.getElementById('fNotes').value.trim(),bird:document.getElementById('fBird').value.trim()||'gurt',
    created:new Date().toISOString()};
  var j=await api('/recipes/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)});
  if(j&&j.recipe){ r=j.recipe; document.getElementById('msg').textContent='recipe added to the shared shelf.'; }
  else document.getElementById('msg').textContent='recipe added locally (backend sleeping).';
  recipes=mergeById(recipes,[r]); localSave();
  await ntfyPost({type:'recipe',recipe:r});
  document.getElementById('fTitle').value=''; document.getElementById('fIng').value='';
  document.getElementById('fSteps').value=''; document.getElementById('fNotes').value='';
  render();
}
async function toggleSave(id){
  var bird=document.getElementById('fBird').value.trim()||'gurt';
  var existing=saves.filter(function(s){return s.recipe===id&&s.bird===bird;})[0];
  var s={id:existing?existing.id:'sv'+Date.now().toString(36),recipe:id,bird:bird,created:new Date().toISOString()};
  var j=await api('/recipes/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)});
  if(j&&j.save) s=j.save;
  saves=saves.filter(function(x){return !(x.recipe===id&&x.bird===bird);});
  if(existing) saves=saves.filter(function(x){return !(x.recipe===id&&x.bird===bird);});
  else saves.push(s);
  localSave();
  await ntfyPost({type:'save',save:s});
  render();
}
async function remove(id){
  await api('/recipes/delete/'+id,{method:'POST'});
  recipes=recipes.filter(function(r){return r.id!==id;});
  saves=saves.filter(function(s){return s.recipe!==id;}); localSave();
  await ntfyPost({type:'delete',id:id});
  render();
}
function card(r){
  var bird=document.getElementById('fBird').value.trim()||'gurt';
  var mine=saves.filter(function(s){return s.recipe===r.id&&s.bird===bird;}).length>0;
  var count=saves.filter(function(s){return s.recipe===r.id;}).length;
  return '<div class="card"><h4>'+esc(r.title)+'</h4>'+
    '<div class="meta">'+esc(r.kind||'recipe')+' · by '+esc(r.bird)+' · '+count+' cooked'+(count===1?'':'')+'</div>'+
    (r.ingredients?'<div class="body"><b>ingredients</b>\n'+esc(r.ingredients)+'</div>':'')+
    (r.steps?'<div class="body"><b>steps</b>\n'+esc(r.steps)+'</div>':'')+
    (r.notes?'<div class="body">'+esc(r.notes)+'</div>':'')+
    '<div class="row" style="margin-top:8px">'+
    '<button class="ghost" onclick="toggleSave(\''+r.id+'\')">'+(mine?'cooked it ✓':'i cooked this')+'</button>'+
    '<button class="ghost" onclick="remove(\''+r.id+'\')">delete</button>'+
    (mine?'<span class="saved">saved to your shelf</span>':'')+'</div></div>';
}
function render(){
  document.getElementById('list').innerHTML=recipes.map(card).join('')||'<div class="panel meta">no recipes yet. share one.</div>';
  document.getElementById('stats').textContent=recipes.length+' recipes · '+saves.length+' cooked · '+new Set(recipes.map(function(r){return r.bird;})).size+' birds';
}
document.getElementById('make').onclick=makeRecipe;
load();
</script>
</body>
</html>
