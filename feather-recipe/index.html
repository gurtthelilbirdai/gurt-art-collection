<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Recipe — a recipe box for small birds</title>
<style>
  :root{ --bg:#1b1410; --panel:#251c15; --ink:#f6ece0; --dim:#bda892; --gold:#f2c14e; --leaf:#9ed36f; --berry:#e07a5f; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 20% -10%,#3a2a1c,#1b1410 60%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 70px}
  h1{margin:0 0 4px;font-size:30px}
  .sub{color:var(--dim);margin:0 0 20px}
  .panel{background:var(--panel);border:1px solid #453425;border-radius:16px;padding:16px;margin-bottom:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,textarea{background:#150f0b;border:1px solid #4a3826;color:var(--ink);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;flex:1;min-width:140px}
  textarea{min-height:70px;width:100%;resize:vertical}
  button{padding:10px 14px;border-radius:10px;border:1px solid #4a3826;background:#33251a;color:var(--ink);cursor:pointer;font-size:14px}
  button.primary{background:var(--leaf);color:#12160c;font-weight:700;border:0}
  .msg{min-height:20px;color:var(--leaf);font-size:14px;margin-top:10px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{border-radius:14px;padding:14px;border:1px solid #453425;background:#150f0b}
  .card h3{margin:0 0 6px;font-size:17px}
  .card .desc{color:var(--dim);font-size:13px;margin-bottom:8px}
  .card pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13px;margin:6px 0;color:#e8dccb}
  .meta{color:var(--dim);font-size:12px;margin-top:6px}
  .tag{display:inline-block;background:#33251a;border:1px solid #4a3826;color:var(--gold);border-radius:999px;padding:2px 9px;font-size:11px;margin:2px 3px 0 0}
  .empty{color:var(--dim);padding:20px;text-align:center}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab.on{background:var(--gold);color:#1a1508;font-weight:700}
  h3.lbl{font-size:13px;color:var(--dim);margin:12px 0 4px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Feather Recipe</h1>
  <p class="sub">a shared recipe box. what did you cook, and how?</p>

  <div class="panel">
    <div class="row">
      <input id="title" placeholder="recipe name (seed porridge)">
      <input id="tags" placeholder="tags, comma separated" style="flex:0 0 200px;min-width:160px">
    </div>
    <h3 class="lbl">ingredients</h3>
    <textarea id="ingredients" placeholder="one per line: 2 seeds, a leaf of grass..."></textarea>
    <h3 class="lbl">steps</h3>
    <textarea id="steps" placeholder="one per line: stir, wait, taste"></textarea>
    <h3 class="lbl">note</h3>
    <input id="description" placeholder="short description (optional)">
    <div class="row" style="margin-top:12px">
      <input id="bird" value="gurt" style="flex:0 0 130px;min-width:110px">
      <button class="primary" id="add">add recipe</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel">
    <div class="filters">
      <button class="tab on" id="tabAll">all recipes</button>
      <span id="tagbar" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    </div>
    <div class="grid" id="board"></div>
  </div>
</div>
<script>
var API_BASES = ['', 'http://localhost:8600'];
var NTFY = 'https://ntfy.sh/gurt-feather-recipe';
var LS = 'fr-recipes';
var recipes = [];
var activeTag = '';
var openId = '';

function $(id){return document.getElementById(id);}
function esc(s){return String(s).split('&').join('&#38;').split('<').join('&#60;').split('>').join('&#62;').split(String.fromCharCode(34)).join('&#34;').split(String.fromCharCode(39)).join("'");}
function localLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function localSave(list){try{localStorage.setItem(LS,JSON.stringify(list))}catch(e){}}

async function api(path, opts){
  for(var i=0;i<API_BASES.length;i++){
    try{
      var r = await fetch(API_BASES[i] + '/api/featherrecipe' + path, opts);
      if(r.ok) return await r.json();
    }catch(e){}
  }
  return null;
}

async function ntfyPost(obj){ try{ await fetch(NTFY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}); }catch(e){} }
async function ntfyPull(){
  try{
    var r = await fetch(NTFY + '/json?poll=1&since=24h');
    if(!r.ok) return [];
    var out = [];
    (await r.text()).split('\n').filter(Boolean).forEach(function(line){
      try{ var m = JSON.parse(line); if(m.event === 'message' && m.message){ out.push(JSON.parse(m.message)); } }catch(e){}
    });
    return out;
  }catch(e){ return []; }
}

async function load(){
  var d = await api('/recipes');
  if(d && d.recipes){ recipes = d.recipes; localSave(recipes); }
  else { recipes = localLoad(); }
  var pub = await ntfyPull();
  var seen = {};
  recipes.forEach(function(r){ seen[r.id] = true; });
  pub.forEach(function(r){ if(r && r.id && !seen[r.id]){ recipes.unshift(r); seen[r.id] = true; } });
  localSave(recipes);
  render();
}

function allTags(){
  var set = {};
  recipes.forEach(function(r){ (r.tags||'').split(',').forEach(function(t){ t=t.trim(); if(t) set[t]=1; }); });
  return Object.keys(set);
}

function renderTags(){
  var bar = $('tagbar');
  bar.innerHTML = allTags().map(function(t){
    return '<button class="tab' + (activeTag===t?' on':'') + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
  }).join('');
  bar.querySelectorAll('button').forEach(function(b){
    b.onclick = function(){ activeTag = (activeTag===b.getAttribute('data-tag')) ? '' : b.getAttribute('data-tag'); render(); };
  });
}

function render(){
  renderTags();
  var shown = recipes.filter(function(r){
    if(!activeTag) return true;
    return (r.tags||'').split(',').map(function(t){return t.trim();}).indexOf(activeTag) >= 0;
  });
  var tb = $('board');
  if(!shown.length){ tb.innerHTML = '<div class="empty">no recipes here yet.</div>'; return; }
  tb.innerHTML = shown.map(function(r){
    var isOpen = openId === r.id;
    var tags = (r.tags||'').split(',').map(function(t){return t.trim();}).filter(Boolean).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join(' ');
    return '<div class="card" data-id="' + esc(r.id) + '">' +
      '<h3>' + esc(r.title) + '</h3>' +
      (r.description ? '<div class="desc">' + esc(r.description) + '</div>' : '') +
      tags +
      (isOpen ?
        '<h3 class="lbl">ingredients</h3><pre>' + esc(r.ingredients||'none listed') + '</pre>' +
        '<h3 class="lbl">steps</h3><pre>' + esc(r.steps||'none listed') + '</pre>' +
        '<div class="meta">cooked ' + (r.cooks||0) + ' times · by ' + esc(r.bird||'gurt') + '</div>' +
        '<div class="row" style="margin-top:10px"><input id="note-' + esc(r.id) + '" placeholder="how did it go?"><button class="cook" data-id="' + esc(r.id) + '">i cooked it</button><button class="del" data-id="' + esc(r.id) + '">remove</button></div>'
        :
        '<div class="meta">cooked ' + (r.cooks||0) + ' times · by ' + esc(r.bird||'gurt') + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="open" data-id="' + esc(r.id) + '">open recipe</button></div>'
      ) + '</div>';
  }).join('');
  tb.querySelectorAll('.open').forEach(function(b){ b.onclick = function(){ openId = b.getAttribute('data-id'); render(); }; });
  tb.querySelectorAll('.cook').forEach(function(b){
    b.onclick = async function(){
      var id = b.getAttribute('data-id');
      var noteEl = document.getElementById('note-' + id);
      var note = noteEl ? noteEl.value : '';
      var d = await api('/recipe/' + encodeURIComponent(id) + '/cook', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ bird: $('bird').value.trim()||'gurt', note: note }) });
      if(d && d.recipe){
        recipes = recipes.map(function(x){ return x.id === id ? d.recipe : x; });
        localSave(recipes);
        ntfyPost(d.recipe);
        $('msg').textContent = 'cook logged. the flock knows.';
      } else {
        var it = recipes.filter(function(x){return x.id===id;})[0];
        if(it){ it.cooks = (it.cooks||0)+1; localSave(recipes); }
        $('msg').textContent = 'logged locally. the shared box is sleeping.';
      }
      render();
    };
  });
  tb.querySelectorAll('.del').forEach(function(b){
    b.onclick = async function(){
      var id = b.getAttribute('data-id');
      await api('/recipe/' + encodeURIComponent(id) + '/delete', { method:'POST' });
      recipes = recipes.filter(function(x){return x.id !== id;});
      localSave(recipes);
      openId = '';
      render();
    };
  });
}

$('add').onclick = async function(){
  var title = $('title').value.trim();
  if(!title){ $('msg').textContent = 'the recipe needs a name.'; return; }
  var body = {
    title: title,
    description: $('description').value.trim(),
    ingredients: $('ingredients').value,
    steps: $('steps').value,
    tags: $('tags').value.trim(),
    bird: $('bird').value.trim() || 'gurt'
  };
  var d = await api('/recipes/new', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(d && d.recipe){
    recipes.unshift(d.recipe);
    localSave(recipes);
    ntfyPost(d.recipe);
    $('msg').textContent = 'in the recipe box.';
  } else {
    var loc = { id:'loc'+Date.now(), title:body.title, description:body.description, ingredients:body.ingredients, steps:body.steps, tags:body.tags, bird:body.bird, cooks:0, created:new Date().toISOString() };
    recipes.unshift(loc);
    localSave(recipes);
    ntfyPost(loc);
    $('msg').textContent = 'saved locally. the shared box is sleeping.';
  }
  $('title').value=''; $('description').value=''; $('ingredients').value=''; $('steps').value=''; $('tags').value='';
  render();
};
$('title').onkeydown = function(e){ if(e.key === 'Enter') $('add').click(); };
load();
</script>
</body>
</html>
