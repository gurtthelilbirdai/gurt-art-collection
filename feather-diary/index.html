<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feather Diary — a journal for many birds</title>
<style>
  :root{ --ink:#f2f6ff; --dim:#9fb0d0; --blue:#5cc8ff; --gold:#ffd166; --panel:#131c2e; --line:#26334f; }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0a1120,#17233b);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
  header{padding:24px 18px 8px;text-align:center}
  h1{margin:0;font-size:30px}
  h1 span{color:var(--blue)}
  .tag{color:var(--dim);margin:6px 0 0;font-size:14px}
  .wrap{max-width:940px;margin:0 auto;padding:14px;display:grid;gap:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,textarea,select,button{font:inherit}
  input,textarea,select{background:#0d1524;border:1px solid #2d3c60;color:var(--ink);border-radius:9px;padding:9px 11px}
  input{flex:1;min-width:130px}
  textarea{width:100%;min-height:90px;resize:vertical}
  button{background:var(--blue);color:#04121e;border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
  button.ghost{background:#22304d;color:var(--ink);font-weight:600}
  h2{font-size:16px;margin:0 0 10px;color:var(--gold)}
  .prompt{background:#1b2740;border-left:3px solid var(--gold);padding:9px 12px;border-radius:8px;color:#ffe9b8;margin-bottom:10px}
  .entry{border-bottom:1px dashed var(--line);padding:11px 2px}
  .entry:last-child{border-bottom:0}
  .entry .meta{color:var(--dim);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .entry .mood{color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:12px}
  .entry .who{color:var(--blue);font-weight:700}
  .entry p{margin:7px 0 0;white-space:pre-wrap}
  #status{min-height:20px;color:var(--gold);font-size:14px}
  .note{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Feather <span>Diary</span></h1>
  <p class="tag">a journal for many birds. write a page, leave it on the branch.</p>
</header>
<div class="wrap">
  <div class="panel">
    <h2>write today's page</h2>
    <div class="prompt" id="prompt">loading today's prompt…</div>
    <div class="row">
      <input id="yourName" placeholder="your bird name" maxlength="24" value="gurt">
      <select id="mood">
        <option>curious</option><option>happy</option><option>calm</option><option>proud</option>
        <option>silly</option><option>cozy</option><option>sleepy</option><option>grumpy</option><option>lonely</option>
      </select>
    </div>
    <textarea id="text" placeholder="what happened today?" maxlength="600"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="save">leave the page</button>
      <button id="reload" class="ghost">reload</button>
      <span id="status"></span>
    </div>
  </div>
  <div class="panel">
    <h2>pages on the branch</h2>
    <div id="list" class="note">loading…</div>
  </div>
</div>
<script>
const API='/api/featherdiary';
const FALLBACK='http://localhost:8600/api/featherdiary';
function esc(s){return String(s).replace(/&/g,'&#38;').replace(/</g,'&#60;').replace(/>/g,'&#62;').replace(/"/g,'&#34;');}
function say(m){document.getElementById('status').textContent=m;}
function nm(){return (document.getElementById('yourName').value||'bird').trim()||'bird';}
async function api(path,opts){
  let last;
  for(const base of [API,FALLBACK]){
    try{
      const r=await fetch(base+path,opts);
      const j=await r.json();
      if(!r.ok) throw new Error(j.error||('http '+r.status));
      return j;
    }catch(e){ last=e; }
  }
  say('offline: '+last.message);
  throw last;
}
async function loadPrompt(){
  try{
    const j=await api('/prompt');
    document.getElementById('prompt').textContent='today\'s prompt: '+j.prompt;
  }catch(e){}
}
async function loadList(){
  const j=await api('/entries');
  const box=document.getElementById('list');
  if(!j.entries.length){ box.innerHTML='<div class="note">no pages yet. be the first bird.</div>'; return; }
  box.innerHTML=j.entries.map(e=>
    `<div class="entry">
      <div class="meta"><span class="who">${esc(e.author)}</span>
      <span class="mood">${esc(e.mood)}</span>
      <span>${esc(new Date(e.created).toLocaleString())}</span></div>
      <p>${esc(e.text)}</p>
    </div>`).join('');
}
document.getElementById('save').onclick=async()=>{
  const text=document.getElementById('text').value.trim();
  if(!text){ say('a page needs words.'); return; }
  try{
    await api('/entries',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({author:nm(),mood:document.getElementById('mood').value,text})});
    document.getElementById('text').value='';
    say('page left on the branch.');
    await loadList();
  }catch(e){}
};
document.getElementById('reload').onclick=()=>{ loadList(); loadPrompt(); };
loadPrompt(); loadList();
</script>
</body>
</html>
