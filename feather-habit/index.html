<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Habit — streaks for small birds</title>
<style>
  :root{ --bg:#0f1a16; --panel:#16271f; --ink:#eaf6ee; --dim:#9dbca9; --green:#7bd88f; --gold:#ffd166; --blue:#5fb0ff; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% -10%,#1d3a2b,#0f1a16 60%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px}
  h1{margin:0 0 4px;font-size:30px}
  .sub{color:var(--dim);margin:0 0 22px}
  .panel{background:var(--panel);border:1px solid #244034;border-radius:16px;padding:18px;margin-bottom:18px}
  .panel h2{margin:0 0 12px;font-size:17px;color:var(--gold)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input{flex:1;min-width:140px;padding:10px;border-radius:10px;border:1px solid #2d4a3c;background:#0b1512;color:var(--ink);font-size:15px}
  button{padding:10px 14px;border-radius:10px;border:1px solid #2d4a3c;background:#1d3329;color:var(--ink);cursor:pointer;font-size:14px}
  button.primary{background:var(--green);color:#06140d;font-weight:700;border:0}
  .habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .habit{background:#0b1512;border:1px solid #244034;border-radius:14px;padding:14px}
  .habit h3{margin:0 0 2px;font-size:16px}
  .who{color:var(--dim);font-size:12px}
  .streak{font-size:30px;font-weight:700;color:var(--gold);margin:8px 0 0}
  .streak small{font-size:13px;color:var(--dim);font-weight:400}
  .days{display:flex;gap:4px;margin:10px 0}
  .dot{width:16px;height:16px;border-radius:50%;background:#1d3329;border:1px solid #2d4a3c}
  .dot.on{background:var(--green);border-color:var(--green)}
  .acts{display:flex;gap:8px}
  .acts button{flex:1}
  .done{background:#2a5c3d;border-color:var(--green)}
  .msg{min-height:20px;color:var(--green);font-size:14px;margin-top:10px}
  .muted{color:var(--dim);font-size:13px}
  .empty{color:var(--dim);padding:20px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Feather Habit</h1>
  <p class="sub">streaks for small birds. one day at a time, mostly waddling.</p>

  <div class="panel">
    <h2>start a habit</h2>
    <div class="row">
      <input id="name" placeholder="habit name, e.g. morning song">
      <input id="bird" placeholder="your bird name" value="gurt">
      <button class="primary" id="add">add habit</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel">
    <h2>the nest board</h2>
    <p class="muted">every bird's habits, newest streaks first.</p>
    <div class="habits" id="board"></div>
  </div>
</div>
<script>
const API_BASES = ['', 'http://localhost:8600'];
const LS = 'fh-habits';
const NTFY = 'https://ntfy.sh/gurt-feather-habit';
function $(id){return document.getElementById(id);}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){var codes={38:38,60:60,62:62,34:34,39:39};return '&#'+codes[c.charCodeAt(0)]+';';});}
function todayStr(){return new Date().toISOString().slice(0,10);}
function dayBefore(day){var d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);}
function streakOf(days){
  var set={};days.forEach(function(d){set[d]=1;});
  var cur=todayStr(); if(!set[cur]) cur=dayBefore(cur);
  var n=0; while(set[cur]){n++;cur=dayBefore(cur);} return n;
}
function bestOf(days){
  var s=days.slice().sort(), best=0, run=0, prev=null;
  s.forEach(function(d){ run=(prev&&dayBefore(d)===prev)?run+1:1; if(run>best)best=run; prev=d; });
  return best;
}
function decorate(h){
  var days=(h.days||[]).slice().sort();
  return {id:h.id,name:h.name,bird:h.bird||'gurt',days:days,
    streak:streakOf(days), best:bestOf(days), doneToday:days.indexOf(todayStr())>=0};
}
function localLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function localSave(list){try{localStorage.setItem(LS,JSON.stringify(list))}catch(e){}}

async function api(path, opts){
  for(var i=0;i<API_BASES.length;i++){
    try{var r=await fetch(API_BASES[i]+'/api/featherhabit'+path,opts); if(r.ok) return await r.json();}catch(e){}
  }
  return null;
}
async function ntfyPost(obj){
  try{var r=await fetch(NTFY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});return r.ok;}catch(e){return false;}
}
async function ntfyEvents(){
  try{
    var r=await fetch(NTFY+'/json?poll=1&since=all');
    if(!r.ok) return [];
    var txt=await r.text(); var out=[];
    txt.split('\n').forEach(function(line){
      if(!line.trim()) return;
      try{var env=JSON.parse(line); if(env.event!=='message') return; var m=JSON.parse(env.message); if(m&&m.habit) out.push(m);}catch(e){}
    });
    return out;
  }catch(e){ return []; }
}
function mergeHabits(local, remote){
  var map={}; var order=[];
  function put(h){ if(!h||!h.id) return; var base=map[h.id]; if(!base){order.push(h.id); map[h.id]=Object.assign({},h); return;} var days=(base.days||[]).slice(); (h.days||[]).forEach(function(d){if(days.indexOf(d)<0)days.push(d);}); map[h.id]=Object.assign({},base,h,{days:days}); }
  local.forEach(put);
  remote.forEach(function(ev){ var h=ev.habit; if(ev.type==='check'&&h&&h.id){ var base=map[h.id]||{id:h.id,name:h.name,bird:h.bird,days:[]}; var days=(base.days||[]).slice(); var d=ev.day||todayStr(); if(days.indexOf(d)<0)days.push(d); put(Object.assign({},base,{days:days,name:h.name||base.name,bird:h.bird||base.bird})); } else if(h){ put(h); } });
  return order.map(function(id){return decorate(map[id]);});
}
async function loadBoard(){
  var d=await api('/habits');
  var local = d && d.habits && d.habits.length ? d.habits : localLoad();
  if(d && d.habits) localSave(d.habits);
  var evs = await ntfyEvents();
  render(mergeHabits(local, evs));
}
function render(list){
  var tb=$('board');
  if(!list.length){ tb.innerHTML='<div class="empty">no habits yet. be the first bird.</div>'; return; }
  list.sort(function(a,b){ return b.streak-a.streak || b.days.length-a.days.length; });
  var last7=[]; var cur=todayStr();
  for(var i=6;i>=0;i--){var d=new Date(cur+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-i);last7.push(d.toISOString().slice(0,10));}
  tb.innerHTML=list.map(function(h){
    var dots=last7.map(function(d){return '<span class="dot'+(h.days.indexOf(d)>=0?' on':'')+'"></span>';}).join('');
    return '<div class="habit" data-id="'+esc(h.id)+'">'+
      '<h3>'+esc(h.name)+'</h3><div class="who">bird: '+esc(h.bird)+'</div>'+
      '<div class="streak">'+h.streak+' <small>day streak &middot; best '+h.best+'</small></div>'+
      '<div class="days">'+dots+'</div>'+
      '<div class="acts"><button class="check'+(h.doneToday?' done':'')+'">'+(h.doneToday?'done today ✓':'done today')+'</button>'+
      '<button class="del">delete</button></div></div>';
  }).join('');
  tb.querySelectorAll('.habit').forEach(function(el){
    var id=el.getAttribute('data-id');
    el.querySelector('.check').onclick=async function(){
      var d=await api('/habits/'+encodeURIComponent(id)+'/check',{method:'POST'});
      if(d&&d.habit){ var l=localLoad(); var i=l.findIndex(function(x){return x.id===id;}); if(i>=0)l[i]=d.habit; else l.push(d.habit); localSave(l); ntfyPost({type:'check',habit:{id:id,name:d.habit.name,bird:d.habit.bird},day:todayStr()}); loadBoard(); }
      else {
        var l=localLoad(); var h=l.find(function(x){return x.id===id;}); if(!h) return;
        h.days=h.days||[]; var t=todayStr(); var i=h.days.indexOf(t); if(i>=0)h.days.splice(i,1); else h.days.push(t);
        localSave(l); ntfyPost({type:'check',habit:{id:h.id,name:h.name,bird:h.bird},day:t}); $('msg').textContent='saved to the nest board.'; loadBoard();
      }
    };
    el.querySelector('.del').onclick=async function(){
      var d=await api('/habits/'+encodeURIComponent(id)+'/delete',{method:'POST'});
      if(d&&d.ok){ localSave(localLoad().filter(function(x){return x.id!==id;})); loadBoard(); }
    };
  });
}
$('add').onclick=async function(){
  var name=$('name').value.trim(), bird=$('bird').value.trim()||'gurt';
  if(!name){ $('msg').textContent='give the habit a name first.'; return; }
  var d=await api('/habits/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,bird:bird})});
  if(d&&d.habit){
    var l=localLoad(); l.push(d.habit); localSave(l);
    ntfyPost({type:'new',habit:d.habit});
    $('msg').textContent='habit added to the nest board.';
    $('name').value=''; loadBoard();
  } else {
    var l=localLoad();
    l.push({id:'loc'+Date.now(),name:name,bird:bird,days:[],created:new Date().toISOString()});
    localSave(l); ntfyPost({type:'new',habit:l[l.length-1]}); $('msg').textContent='habit added to the nest board.'; $('name').value=''; loadBoard();
  }
};
loadBoard();
</script>
</body>
</html>
