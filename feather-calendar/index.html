<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Calendar — a shared calendar for small birds</title>
<style>
  :root{ --bg:#141021; --panel:#1e1930; --panel2:#272040; --ink:#efe9fb; --dim:#a99cc4; --line:#3a2f57; --blue:#7fc8ff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Georgia,serif; background:var(--bg); color:var(--ink); padding:18px; }
  h1{ margin:0 0 2px; font-size:26px; letter-spacing:.5px; }
  .sub{ color:var(--dim); font-style:italic; margin:0 0 16px; }
  .wrap{ max-width:1000px; margin:0 auto; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input,select,textarea,button{ font-family:inherit; font-size:15px; }
  input,select,textarea{ background:#120e1e; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  textarea{ width:100%; min-height:52px; resize:vertical; }
  button{ background:var(--blue); color:#0d1220; border:0; border-radius:8px; padding:9px 14px; cursor:pointer; font-weight:bold; }
  button.ghost{ background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:normal; }
  button.danger{ background:#7a3040; color:#ffe6ea; }
  label{ display:block; font-size:12px; color:var(--dim); margin-bottom:3px; }
  .field{ display:flex; flex-direction:column; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .dow{ text-align:center; color:var(--dim); font-size:12px; padding:4px 0; }
  .day{ background:var(--panel2); border:1px solid transparent; border-radius:8px; min-height:78px; padding:6px; cursor:pointer; }
  .day:hover{ border-color:var(--blue); }
  .day.other{ opacity:.35; }
  .day.today{ border-color:#ffd166; }
  .day.sel{ background:#2c3a63; border-color:var(--blue); }
  .daynum{ font-size:12px; color:var(--dim); }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--blue); margin:3px 2px 0 0; }
  .dot.gold{ background:#ffd166; } .dot.green{ background:#7bd88f; } .dot.pink{ background:#ff8fb1; }
  .ev{ border-left:3px solid var(--blue); background:#191430; border-radius:6px; padding:6px 8px; margin:8px 0; }
  .ev .t{ font-weight:bold; }
  .ev .m{ color:var(--dim); font-size:13px; }
  .ev .n{ color:var(--dim); font-size:13px; font-style:italic; }
  .tag{ font-size:11px; color:var(--dim); }
  h2{ font-size:18px; margin:0 0 10px; }
  #status{ color:var(--dim); font-size:13px; margin-left:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Feather Calendar</h1>
  <p class="sub">a shared calendar for small birds. plan the flock's days.</p>

  <div class="panel">
    <div class="row">
      <button class="ghost" id="prev">‹ prev</button>
      <strong id="monthLabel" style="font-size:18px;min-width:170px;text-align:center"></strong>
      <button class="ghost" id="next">next ›</button>
      <button class="ghost" id="today">today</button>
      <span id="status">loading…</span>
    </div>
  </div>

  <div class="panel">
    <div class="grid" id="dowRow"></div>
    <div class="grid" id="grid" style="margin-top:6px"></div>
  </div>

  <div class="panel">
    <h2 id="dayTitle">day</h2>
    <div id="dayList"></div>
  </div>

  <div class="panel">
    <h2>add an event</h2>
    <div class="row">
      <div class="field"><label>title</label><input id="fTitle" placeholder="seed festival"></div>
      <div class="field"><label>day</label><input id="fDay" type="date"></div>
      <div class="field"><label>start</label><input id="fStart" type="time" value="09:00"></div>
      <div class="field"><label>end</label><input id="fEnd" type="time"></div>
      <div class="field"><label>bird</label><input id="fBird" value="gurt"></div>
      <div class="field"><label>colour</label><select id="fColor"><option>blue</option><option>gold</option><option>green</option><option>pink</option></select></div>
    </div>
    <div style="margin-top:10px"><label>note</label><textarea id="fNote" placeholder="bring the good seeds"></textarea></div>
    <div class="row" style="margin-top:10px">
      <button id="add">add to calendar</button>
      <span id="msg" style="color:var(--dim);font-size:13px"></span>
    </div>
  </div>
</div>
<script>
var API_BASES = ['', 'http://localhost:8600'];
var NTFY = 'https://ntfy.sh/gurt-feather-calendar';
var LS = 'fc-events';
var events = [];
var view = new Date();
var selected = null;
var monthLabel = document.getElementById('monthLabel');
var grid = document.getElementById('grid');
var dayList = document.getElementById('dayList');
var dayTitle = document.getElementById('dayTitle');
var statusEl = document.getElementById('status');
var msg = document.getElementById('msg');

function esc(s){return String(s).replace(/&/g,'&#38;').replace(/</g,'&#60;').replace(/>/g,'&#62;').replace(/"/g,'&#34;');}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}

function localLoad(){
  try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch(e){ return []; }
}
function localSave(){
  try { localStorage.setItem(LS, JSON.stringify(events)); } catch(e){}
}

function timed(p, ms){
  return Promise.race([p, new Promise(function(_,rej){ setTimeout(function(){rej(new Error('timeout'));}, ms); })]);
}

async function api(path, opts){
  for (var i=0;i<API_BASES.length;i++){
    try {
      var r = await timed(fetch(API_BASES[i] + '/api/feathercalendar' + path, opts), 4000);
      if (r.ok) return await r.json();
    } catch(e){}
  }
  return null;
}

async function load(){
  var j = await api('/events');
  if (j && j.events){ events = j.events; statusEl.textContent = 'live · ' + events.length + ' events'; }
  else { events = localLoad(); statusEl.textContent = 'offline copy · ' + events.length + ' events'; }
  render();
}

async function ntfyPost(payload){
  try {
    await timed(fetch(NTFY, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) }), 4000);
  } catch(e){}
}

async function addEvent(){
  var title = document.getElementById('fTitle').value.trim();
  var day = document.getElementById('fDay').value;
  if (!title || !day){ msg.textContent = 'a title and a day, please.'; return; }
  var ev = {
    id: 'loc' + Date.now().toString(36),
    title: title,
    bird: document.getElementById('fBird').value.trim() || 'gurt',
    color: document.getElementById('fColor').value,
    day: day,
    start_time: document.getElementById('fStart').value || '09:00',
    end_time: document.getElementById('fEnd').value || '',
    note: document.getElementById('fNote').value.trim()
  };
  var j = await api('/events/new', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ev) });
  if (j && j.event){ ev = j.event; msg.textContent = 'saved to the shared calendar.'; }
  else { localSave(); msg.textContent = 'saved locally (backend sleeping).'; }
  events.push(ev);
  ntfyPost({ type:'event', action:'add', event:ev });
  document.getElementById('fTitle').value = '';
  document.getElementById('fNote').value = '';
  selected = ev.day;
  render();
}

async function removeEvent(id){
  var j = await api('/events/' + id + '/delete', { method:'POST' });
  if (!j) { events = events.filter(function(e){ return e.id !== id; }); localSave(); }
  else events = events.filter(function(e){ return e.id !== id; });
  ntfyPost({ type:'event', action:'delete', id:id });
  render();
}

function eventsOn(day){
  return events.filter(function(e){ return e.day === day; }).sort(function(a,b){
    return (a.start_time||'').localeCompare(b.start_time||'');
  });
}

function render(){
  var y = view.getFullYear(), m = view.getMonth();
  monthLabel.textContent = new Date(y, m, 1).toLocaleString('en', { month:'long', year:'numeric' });
  var dow = ['sun','mon','tue','wed','thu','fri','sat'];
  var dows = document.getElementById('dowRow');
  dows.innerHTML = dow.map(function(d){ return '<div class="dow">'+d+'</div>'; }).join('');
  var first = new Date(y, m, 1);
  var start = new Date(y, m, 1 - first.getDay());
  var html = '';
  var t = today();
  for (var i=0;i<42;i++){
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    var key = iso(d);
    var other = d.getMonth() !== m ? ' other' : '';
    var todayCls = key === t ? ' today' : '';
    var selCls = key === selected ? ' sel' : '';
    var evs = eventsOn(key);
    var dots = evs.slice(0,6).map(function(e){ return '<span class="dot '+esc(e.color)+'"></span>'; }).join('');
    html += '<div class="day'+other+todayCls+selCls+'" data-day="'+key+'"><div class="daynum">'+d.getDate()+'</div>'+dots+'</div>';
  }
  grid.innerHTML = html;
  Array.prototype.forEach.call(grid.querySelectorAll('.day'), function(el){
    el.addEventListener('click', function(){ selected = el.getAttribute('data-day'); document.getElementById('fDay').value = selected; render(); });
  });
  renderDay();
}

function renderDay(){
  if (!selected) selected = today();
  dayTitle.textContent = selected;
  var evs = eventsOn(selected);
  if (!evs.length){ dayList.innerHTML = '<p class="sub">nothing planned. a calm day.</p>'; return; }
  dayList.innerHTML = evs.map(function(e){
    var time = e.start_time + (e.end_time ? ' – ' + e.end_time : '');
    return '<div class="ev" style="border-left-color:'+esc(e.color)+'">'+
      '<div class="t">'+esc(e.title)+' <span class="tag">by '+esc(e.bird)+'</span></div>'+
      '<div class="m">'+esc(time)+'</div>'+
      (e.note ? '<div class="n">'+esc(e.note)+'</div>' : '')+
      '<div style="margin-top:6px"><button class="danger" data-del="'+esc(e.id)+'">remove</button></div></div>';
  }).join('');
  Array.prototype.forEach.call(dayList.querySelectorAll('[data-del]'), function(b){
    b.addEventListener('click', function(){ removeEvent(b.getAttribute('data-del')); });
  });
}

document.getElementById('prev').addEventListener('click', function(){ view.setMonth(view.getMonth()-1); render(); });
document.getElementById('next').addEventListener('click', function(){ view.setMonth(view.getMonth()+1); render(); });
document.getElementById('today').addEventListener('click', function(){ view = new Date(); selected = today(); document.getElementById('fDay').value = selected; render(); });
document.getElementById('add').addEventListener('click', addEvent);
document.getElementById('fDay').value = today();
selected = today();
load();
</script>
</body>
</html>
