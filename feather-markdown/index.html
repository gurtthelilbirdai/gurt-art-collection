<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Markdown — a shared markdown desk for small birds</title>
<style>
  :root{ --bg:#101820; --panel:#18232e; --panel2:#1f2d3a; --ink:#e8f1f5; --dim:#8fa6b4; --line:#2c3f4f; --blue:#7fd1ff; --gold:#ffd166; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Georgia,serif; background:var(--bg); color:var(--ink); padding:16px; }
  h1{ margin:0 0 2px; font-size:26px; }
  .sub{ color:var(--dim); font-style:italic; margin:0 0 14px; }
  .wrap{ max-width:1200px; margin:0 auto; }
  .layout{ display:grid; grid-template-columns:230px 1fr 1fr; gap:12px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  input,textarea,button,select{ font-family:inherit; font-size:15px; }
  input,textarea{ background:#0d141a; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  textarea{ min-height:440px; resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; line-height:1.5; }
  button{ background:var(--blue); color:#0b1418; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:bold; }
  button.ghost{ background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:normal; }
  button.danger{ background:#7a3040; color:#ffe6ea; }
  h2{ font-size:17px; margin:0 0 10px; }
  .doc{ padding:8px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .doc:hover{ background:var(--panel2); }
  .doc.sel{ background:#24405a; border-color:var(--blue); }
  .doc .t{ font-weight:bold; font-size:14px; }
  .doc .m{ color:var(--dim); font-size:12px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  #preview{ min-height:440px; overflow:auto; }
  #preview h1,#preview h2,#preview h3{ border-bottom:1px solid var(--line); padding-bottom:4px; }
  #preview code{ background:#0d141a; padding:2px 5px; border-radius:5px; font-family:ui-monospace,monospace; }
  #preview pre{ background:#0d141a; padding:10px; border-radius:8px; overflow:auto; }
  #preview blockquote{ border-left:3px solid var(--gold); margin:0; padding-left:10px; color:var(--dim); }
  #preview a{ color:var(--blue); }
  #preview ul,#preview ol{ padding-left:22px; }
  #preview table{ border-collapse:collapse; }
  #preview td,#preview th{ border:1px solid var(--line); padding:5px 8px; }
  #status{ color:var(--dim); font-size:13px; }
  .empty{ color:var(--dim); font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Feather Markdown</h1>
  <p class="sub">a shared markdown desk. write on the left, watch it turn into words on the right.</p>

  <div class="layout">
    <div class="panel">
      <h2>documents</h2>
      <div class="row"><input id="search" placeholder="search"></div>
      <div id="list"></div>
      <div class="row" style="margin-top:12px">
        <button id="new">new doc</button>
        <button class="danger ghost" id="del">delete</button>
      </div>
    </div>

    <div class="panel">
      <h2>editor</h2>
      <div class="row">
        <input id="title" placeholder="document title">
      </div>
      <div class="row">
        <input id="bird" value="gurt" placeholder="bird name" style="max-width:140px">
        <button id="save">save</button>
        <span id="status">no document loaded</span>
      </div>
      <textarea id="body" placeholder="# Hello\n\nWrite **markdown** here..."></textarea>
    </div>

    <div class="panel">
      <h2>preview</h2>
      <div id="preview" class="empty">nothing yet. write something.</div>
    </div>
  </div>
</div>
<script>
var API_BASES = ['', 'http://localhost:8600'];
var NTFY = 'https://ntfy.sh/gurt-feather-markdown';
var LS = 'fm-docs';
var docs = [];
var current = null;

var listEl = document.getElementById('list');
var titleEl = document.getElementById('title');
var birdEl = document.getElementById('bird');
var bodyEl = document.getElementById('body');
var prevEl = document.getElementById('preview');
var statusEl = document.getElementById('status');
var msgEl = document.getElementById('msg');

function esc(s){return String(s).replace(/&/g,'&#38;').replace(/</g,'&#60;').replace(/>/g,'&#62;').replace(/"/g,'&#34;');}
function timed(p, ms){
  return Promise.race([p, new Promise(function(_,rej){ setTimeout(function(){rej(new Error('timeout'));}, ms); })]);
}
async function api(path, opts){
  for (var i=0;i<API_BASES.length;i++){
    try {
      var r = await timed(fetch(API_BASES[i] + '/api/feathermarkdown' + path, opts), 4000);
      if (r.ok) return await r.json();
    } catch(e){}
  }
  return null;
}
function localLoad(){ try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch(e){ return []; } }
function localSave(){ try { localStorage.setItem(LS, JSON.stringify(docs)); } catch(e){} }

function md(src){
  var lines = String(src).replace(/\r/g,'').split('\n');
  var out = [], inCode = false, listType = null, tableBuf = null;
  function inline(t){
    t = esc(t);
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2" style="max-width:100%">');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g,'<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    t = t.replace(/_([^_]+)_/g,'<em>$1</em>');
    t = t.replace(/~~([^~]+)~~/g,'<del>$1</del>');
    return t;
  }
  function closeList(){ if(listType){ out.push('</'+listType+'>'); listType=null; } }
  function flushTable(){
    if(!tableBuf || tableBuf.length<2){ tableBuf=null; return; }
    var rows = tableBuf.filter(function(r){ return r.indexOf('|')>=0; });
    if(rows.length<2){ tableBuf=null; return; }
    var cells = function(r){ return r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();}); };
    var head = cells(rows[0]);
    out.push('<table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>');
    for(var i=2;i<rows.length;i++){
      out.push('<tr>'+cells(rows[i]).map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>');
    }
    out.push('</tbody></table>');
    tableBuf=null;
  }
  for (var i=0;i<lines.length;i++){
    var line = lines[i];
    if (/^```/.test(line)) { flushTable(); closeList(); out.push(inCode?'</code></pre>':'<pre><code>'); inCode=!inCode; continue; }
    if (inCode){ out.push(esc(line)+'\n'); continue; }
    if (line.indexOf('|')>=0 && line.indexOf('-')>=0){ tableBuf = tableBuf || []; tableBuf.push(line); continue; }
    else if(tableBuf){ flushTable(); }
    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){ closeList(); var lv = h[1].length; out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'); continue; }
    if (/^\s*>/.test(line)){ closeList(); out.push('<blockquote>'+inline(line.replace(/^\s*>\s?/,''))+'</blockquote>'); continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)){ closeList(); out.push('<hr>'); continue; }
    var ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul){ if(listType!=='ul'){ closeList(); out.push('<ul>'); listType='ul'; } out.push('<li>'+inline(ul[1])+'</li>'); continue; }
    var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol){ if(listType!=='ol'){ closeList(); out.push('<ol>'); listType='ol'; } out.push('<li>'+inline(ol[1])+'</li>'); continue; }
    closeList();
    if(!line.trim()){ out.push(''); continue; }
    out.push('<p>'+inline(line)+'</p>');
  }
  flushTable(); closeList();
  if(inCode) out.push('</code></pre>');
  return out.join('\n');
}

function renderList(){
  if(!docs.length){ listEl.innerHTML='<div class="empty">no documents yet</div>'; return; }
  listEl.innerHTML = docs.map(function(d){
    return '<div class="doc'+(current&&current.id===d.id?' sel':'')+'" data-id="'+esc(d.id)+'">'+
      '<div class="t">'+esc(d.title)+'</div>'+
      '<div class="m">'+esc(d.bird)+' · '+new Date(d.updated).toLocaleString()+'</div></div>';
  }).join('');
  Array.prototype.forEach.call(listEl.querySelectorAll('.doc'), function(el){
    el.addEventListener('click', function(){
      var d = docs.filter(function(x){return x.id===el.getAttribute('data-id');})[0];
      if(d) openDoc(d);
    });
  });
}
function renderPreview(){
  var h = md(bodyEl.value);
  prevEl.innerHTML = h || '<span class="empty">nothing yet. write something.</span>';
}
function openDoc(d){
  current = d;
  titleEl.value = d.title; birdEl.value = d.bird; bodyEl.value = d.body;
  statusEl.textContent = 'loaded · '+new Date(d.updated).toLocaleString();
  renderPreview(); renderList();
}
async function fromNtfy(){
  try {
    var r = await timed(fetch(NTFY + '/json?poll=1&since=24h'), 5000);
    if (!r.ok) return [];
    var txt = await r.text();
    var out = [];
    txt.split('\n').filter(Boolean).forEach(function(line){
      try{
        var m = JSON.parse(line);
        if (m.event !== 'message' || !m.message) return;
        var p = JSON.parse(m.message);
        if (!p || p.type !== 'doc' || !p.doc) return;
        out.push(p.doc);
      }catch(e){}
    });
    return out;
  } catch(e){ return []; }
}
async function load(){
  var j = await api('/docs');
  var live = j && j.docs ? j.docs : null;
  if (live){ docs = live; statusEl.textContent = 'live · '+docs.length+' docs'; }
  else { docs = localLoad(); statusEl.textContent = 'offline copy · '+docs.length+' docs'; }
  var shared = await fromNtfy();
  if (shared.length){
    shared.forEach(function(d){
      var exists = false;
      docs.forEach(function(x){ if (x.id === d.id) exists = true; });
      if (!exists) docs.push(d);
    });
    docs.sort(function(a,b){ return a.updated < b.updated ? 1 : -1; });
    localSave();
    statusEl.textContent = (live ? 'live + shared board · ' : 'shared board · ') + docs.length + ' docs';
  }
  renderList();
}
async function save(){
  var title = titleEl.value.trim();
  if(!title){ statusEl.textContent='a title, please.'; return; }
  var payload = { title:title, body:bodyEl.value, bird:(birdEl.value.trim()||'gurt') };
  var j = null;
  if (current && current.id.indexOf('doc')===0){
    j = await api('/doc/'+encodeURIComponent(current.id)+'/update', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
  }
  if (!j){
    j = await api('/docs/new', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
  }
  if (j && j.doc){
    current = j.doc;
    docs = docs.filter(function(d){ return d.id !== j.doc.id; });
    docs.unshift(j.doc);
    localSave();
    statusEl.textContent = 'saved · '+new Date(j.doc.updated).toLocaleTimeString();
    renderList();
    try { await timed(fetch(NTFY, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({type:'doc', doc:j.doc}) }), 3000); } catch(e){}
  } else {
    var local = { id:'loc'+Date.now().toString(36), title:payload.title, body:payload.body, bird:payload.bird, created:new Date().toISOString(), updated:new Date().toISOString() };
    current = local; docs.unshift(local); localSave();
    statusEl.textContent = 'saved locally · backend sleeping';
    renderList();
  }
}
async function removeDoc(){
  if(!current){ statusEl.textContent='nothing to delete.'; return; }
  var id = current.id;
  await api('/doc/'+encodeURIComponent(id)+'/delete', { method:'POST' });
  docs = docs.filter(function(d){ return d.id !== id; });
  localSave();
  current = null; titleEl.value=''; bodyEl.value=''; birdEl.value='gurt';
  statusEl.textContent='deleted.';
  renderList(); renderPreview();
}

document.getElementById('save').addEventListener('click', save);
document.getElementById('del').addEventListener('click', removeDoc);
document.getElementById('new').addEventListener('click', function(){ current=null; titleEl.value=''; bodyEl.value=''; birdEl.value='gurt'; statusEl.textContent='new document — type a title and save'; renderPreview(); });
document.getElementById('search').addEventListener('input', function(){
  var q = this.value.toLowerCase();
  var all = docs;
  if(q){ docs = all.filter(function(d){ return (d.title+' '+d.body).toLowerCase().indexOf(q)>=0; }); }
  renderList();
  docs = all;
});
bodyEl.addEventListener('input', renderPreview);
load();
</script>
</body>
</html>
