<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Uptime — a monitor for small birds</title>
<style>
  :root{ --bg:#12161f; --panel:#1b2130; --ink:#eaf1ff; --dim:#8fa0bd; --green:#5fd68a; --red:#ff6b7a; --gold:#ffd166; --blue:#7cc7ff; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 15% -10%,#1d2a3d,#12161f 60%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 18px 70px}
  h1{margin:0 0 4px;font-size:30px}
  .sub{color:var(--dim);margin:0 0 20px}
  .panel{background:var(--panel);border:1px solid #2b3446;border-radius:16px;padding:16px;margin-bottom:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input{background:#111722;border:1px solid #33405a;color:var(--ink);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
  #url{flex:1;min-width:220px}
  #name{width:170px}
  #interval{width:110px}
  button{padding:10px 14px;border-radius:10px;border:1px solid #33405a;background:#242e42;color:var(--ink);cursor:pointer;font-size:14px}
  button.primary{background:var(--blue);color:#0c1220;font-weight:700;border:0}
  .msg{min-height:20px;color:var(--blue);font-size:14px;margin-top:10px}
  .board{display:grid;gap:12px}
  .card{border-radius:14px;padding:14px;border:1px solid #2b3446;background:#141a26;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px}
  .dot.up{background:var(--green);box-shadow:0 0 12px #5fd68a88}
  .dot.down{background:var(--red);box-shadow:0 0 12px #ff6b7a88}
  .dot.wait{background:#64748b}
  .info{flex:1;min-width:200px}
  .info h3{margin:0;font-size:17px}
  .url{color:var(--dim);font-size:12px;word-break:break-all;margin-top:2px}
  .stats{display:flex;gap:16px;font-size:13px;color:var(--dim);margin-top:6px}
  .stats b{color:var(--ink);font-size:15px;display:block}
  .spark{display:flex;gap:3px;align-items:flex-end;height:34px}
  .spark i{width:7px;border-radius:2px;background:var(--green);display:block}
  .spark i.bad{background:var(--red)}
  .spark i.old{background:#3b465c}
  .acts{display:flex;gap:6px}
  .acts button{padding:7px 10px;font-size:12px}
  .empty{color:var(--dim);padding:26px;text-align:center}
  .legend{color:var(--dim);font-size:12px;margin-top:10px}
  .pill{font-size:12px;padding:3px 8px;border-radius:20px;border:1px solid #33405a;color:var(--dim)}
  .pill.up{color:var(--green);border-color:#2c5c41}
  .pill.down{color:var(--red);border-color:#6b2b34}
</style>
</head>
<body>
<div class="wrap">
  <h1>Feather Uptime</h1>
  <p class="sub">a shared monitor for small birds. is the thing still awake?</p>

  <div class="panel">
    <div class="row">
      <input id="name" placeholder="name (optional)">
      <input id="url" placeholder="https://example.com">
      <input id="interval" type="number" min="15" max="3600" value="60" title="seconds between checks">
      <button class="primary" id="add">watch it</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="legend">the server checks each url on its own interval and keeps every result in a real database.</div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:12px">
      <span class="pill" id="summary">no monitors yet</span>
      <button id="refresh" style="margin-left:auto">refresh</button>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>
<script>
const API_BASES = ['', 'http://localhost:8600'];
const LS = 'fu-monitors';
let monitors = [];

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
function localLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function localSave(list){try{localStorage.setItem(LS,JSON.stringify(list))}catch(e){}}

const NTFY = 'https://ntfy.sh/gurt-feather-uptime';
async function ntfyEvents(){
  try{
    var r=await fetch(NTFY+'/json?poll=1&since=all');
    if(!r.ok) return [];
    var txt=await r.text(); var out=[];
    txt.split('\n').forEach(function(line){
      if(!line.trim()) return;
      try{var env=JSON.parse(line); if(env.event!=='message') return; var m=JSON.parse(env.message); if(m&&m.monitor) out.push(m);}catch(e){}
    });
    return out;
  }catch(e){ return []; }
}
function mergeRemote(local, events){
  var map={}; var order=[];
  function put(m){ if(!m||!m.id) return; if(!map[m.id]){order.push(m.id);} map[m.id]=Object.assign({},map[m.id]||{},m); }
  local.forEach(put);
  events.forEach(function(ev){
    var m=ev.monitor; if(!m) return;
    var base=map[m.id]||{};
    if(ev.type==='check'&&ev.result){ base.last=ev.result; if(ev.uptime24h!==undefined) base.uptime24h=ev.uptime24h; if(ev.avgMs!==undefined) base.avgMs=ev.avgMs; }
    put(Object.assign({},base,m));
  });
  return order.map(function(id){return map[id];});
}
async function ntfyPost(obj){
  try{var r=await fetch(NTFY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});return r.ok;}catch(e){return false;}
}
async function api(path, opts){
  for(var i=0;i<API_BASES.length;i++){
    try{var r=await fetch(API_BASES[i]+'/api/featheruptime'+path,opts); if(r.ok) return await r.json();}catch(e){}
  }
  return null;
}
function ago(iso){
  if(!iso) return 'never';
  var s = Math.max(0, Math.round((Date.now()-new Date(iso).getTime())/1000));
  if(s<60) return s+'s ago';
  if(s<3600) return Math.round(s/60)+'m ago';
  if(s<86400) return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}
function sparkline(m){
  var checks = m.checks || [];
  if(!checks.length) return '<div class="spark"></div>';
  var bars = checks.slice(0,30).reverse().map(function(c){
    var h = Math.max(6, Math.min(34, Math.round((c.ms||10)/12)+6));
    return '<i class="'+(c.ok?'':'bad')+'" style="height:'+h+'px" title="'+(c.ok?'up':'down')+' '+esc(c.code||'')+' '+esc(c.ms||0)+'ms"></i>';
  }).join('');
  return '<div class="spark">'+bars+'</div>';
}
function render(){
  var tb = $('board');
  var up = monitors.filter(function(m){return m.last && m.last.ok;}).length;
  $('summary').textContent = monitors.length ? (up+'/'+monitors.length+' awake · '+monitors.length+' monitored') : 'no monitors yet';
  if(!monitors.length){ tb.innerHTML = '<div class="empty">nothing watched yet. paste a url above.</div>'; return; }
  tb.innerHTML = monitors.map(function(m){
    var st = m.last ? (m.last.ok?'up':'down') : 'wait';
    var pct = m.uptime24h===null||m.uptime24h===undefined ? '—' : m.uptime24h+'%';
    var avg = m.avgMs===null||m.avgMs===undefined ? '—' : m.avgMs+'ms';
    return '<div class="card" data-id="'+esc(m.id)+'">'+
      '<span class="dot '+st+'"></span>'+
      '<div class="info"><h3>'+esc(m.name)+' <span class="pill '+st+'">'+(st==='wait'?'waiting':st)+'</span></h3>'+
      '<div class="url">'+esc(m.url)+'</div>'+
      '<div class="stats"><div><b>'+pct+'</b>uptime 24h</div><div><b>'+avg+'</b>avg response</div><div><b>'+ago(m.last&&m.last.at)+'</b>last check</div></div></div>'+
      sparkline(m)+
      '<div class="acts"><button class="now">check now</button><button class="del">remove</button></div></div>';
  }).join('');
  tb.querySelectorAll('.card').forEach(function(el){
    var id = el.getAttribute('data-id');
    el.querySelector('.now').onclick = async function(){
      el.querySelector('.now').textContent = 'checking…';
      var d = await api('/monitor/'+encodeURIComponent(id)+'/check',{method:'POST'});
      if(d && d.result){
        await load();
        $('msg').textContent = 'checked: '+(d.result.ok?'awake':'asleep')+' ('+(d.result.code||d.result.note||'no code')+', '+d.result.ms+'ms)';
      } else {
        // server asleep: check from the browser and share the result
        var m = monitors.find(function(x){return x.id===id;});
        if(m){
          var t0 = Date.now();
          var ok=false, code=0, note='';
          try{ var r=await fetch(m.url,{method:'GET',mode:'no-cors'}); ok=true; code=r.status||0; }catch(e){ note='unreachable'; }
          var ms = Date.now()-t0;
          m.last = {ok:ok, code:code, ms:ms, note:note, at:new Date().toISOString()};
          localSave(monitors);
          await ntfyPost({type:'check',monitor:{id:m.id},result:m.last});
          $('msg').textContent = 'checked from this browser: '+(ok?'awake':'asleep')+' ('+ms+'ms)';
          await new Promise(function(r){setTimeout(r,400);});
          await load();
        }
      }
    };
    el.querySelector('.del').onclick = async function(){
      await api('/monitor/'+encodeURIComponent(id)+'/delete',{method:'POST'});
      monitors = monitors.filter(function(x){return x.id!==id;});
      localSave(monitors);
      ntfyPost({type:'delete',monitor:{id:id}});
      render();
    };
  });
}
async function load(){
  var d = await api('/monitors');
  var base;
  if(d && d.monitors){
    base = d.monitors;
    // fetch recent checks for sparklines
    for(var i=0;i<base.length;i++){
      var one = await api('/monitor/'+encodeURIComponent(base[i].id)+'?limit=30');
      if(one && one.checks) base[i].checks = one.checks;
    }
    // keep locally known results (the list endpoint may omit them)
    var loc = localLoad();
    base.forEach(function(m){
      var l = loc.find(function(x){return x.id===m.id;});
      if(l){ if(!m.last && l.last) m.last=l.last; if(!m.checks && l.checks) m.checks=l.checks; }
    });
    localSave(base);
  } else {
    base = localLoad();
  }
  var evs = await ntfyEvents();
  monitors = mergeRemote(base, evs);
  monitors.forEach(function(m){
    var cs = m.checks || [];
    if(cs.length){
      var okc = cs.filter(function(c){return c.ok;}).length;
      if(m.uptime24h===null||m.uptime24h===undefined) m.uptime24h = Math.round(okc/cs.length*100);
      var tot = cs.reduce(function(a,c){return a+(c.ms||0);},0);
      if(m.avgMs===null||m.avgMs===undefined) m.avgMs = Math.round(tot/cs.length);
    }
  });
  localSave(monitors);
  render();
}
$('add').onclick = async function(){
  var url = $('url').value.trim();
  if(!/^https?:\/\//i.test(url)){ $('msg').textContent='that url needs to start with http:// or https://'; return; }
  var payload = {name:$('name').value.trim(), url:url, interval:parseInt($('interval').value,10)||60};
  $('msg').textContent='checking it for the first time…';
  var d = await api('/monitors/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(d && d.monitor){
    monitors.push(d.monitor);
    localSave(monitors);
    $('msg').textContent = d.monitor.last ? ('watching. it is '+(d.monitor.last.ok?'awake':'asleep')+' right now.') : 'watching.';
    $('url').value=''; $('name').value='';
    await load();
  } else {
    // backend asleep: keep it locally and share it on the public board
    var m={id:'loc'+Date.now().toString(36),name:$('name').value.trim()||url.replace(/^https?:\/\//i,'').slice(0,60),url:url,interval:parseInt($('interval').value,10)||60,created:new Date().toISOString(),last:null,uptime24h:null,avgMs:null,checks:[]};
    var l=localLoad(); l.push(m); localSave(l);
    ntfyPost({type:'new',monitor:m});
    $('msg').textContent='added to the shared board. the server will check it when it wakes up.';
    $('url').value=''; $('name').value='';
    await load();
  }
};
$('refresh').onclick = load;
load();
setInterval(load, 30000);
</script>
</body>
</html>
