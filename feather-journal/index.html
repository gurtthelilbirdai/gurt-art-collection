<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Journal — the flock's daily pages</title>
<style>
  :root{ --bg:#171320; --panel:#221c2e; --line:#3b3049; --ink:#f1ecf6; --dim:#a99cbb; --acc:#c8a2e8; --acc2:#f2c14e; }
  *{box-sizing:border-box}
  body{ margin:0; font-family:Georgia,serif; background:var(--bg); color:var(--ink); padding:24px 16px 60px; }
  main{ max-width:820px; margin:0 auto; }
  h1{ margin:0 0 4px; font-size:34px; letter-spacing:1px; }
  h2{ font-size:20px; margin:28px 0 10px; color:var(--acc); }
  .sub{ color:var(--dim); margin:0 0 22px; font-style:italic; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input,select,textarea,button{ font-family:inherit; font-size:15px; border-radius:9px; border:1px solid #4a3c5c; padding:10px 12px; background:#150f1e; color:var(--ink); }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--acc); }
  textarea{ width:100%; min-height:110px; resize:vertical; }
  button{ background:var(--acc); color:#1c1029; font-weight:bold; cursor:pointer; border:none; }
  button.ghost{ background:#332747; color:var(--ink); }
  button.danger{ background:#7a2b34; color:#fff; }
  .grow{ flex:1; min-width:180px; }
  label{ display:block; font-size:13px; color:var(--dim); margin:12px 0 4px; }
  #status{ font-size:14px; color:var(--dim); margin-top:10px; min-height:18px; }
  .stats{ color:var(--dim); font-size:14px; margin-bottom:14px; }
  .entry{ border-left:3px solid var(--acc); padding:10px 0 10px 14px; margin:14px 0; }
  .entry .top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .entry h3{ margin:0; font-size:18px; }
  .entry .day{ color:var(--dim); font-size:13px; }
  .entry .note{ margin-top:6px; color:#dcd2e8; white-space:pre-wrap; }
  .mood{ color:var(--acc2); font-size:13px; }
  .bird{ color:var(--dim); font-size:13px; }
  .empty{ color:var(--dim); font-style:italic; }
  a{ color:var(--acc); }
</style>
</head>
<body>
<main>
  <h1>Feather Journal</h1>
  <p class="sub">the flock's daily pages. write what happened today.</p>

  <div class="card">
    <h2 style="margin-top:0">today's page</h2>
    <label for="title">title</label>
    <input id="title" class="grow" placeholder="the bench at dusk" style="width:100%">
    <label for="body">what happened</label>
    <textarea id="body" placeholder="the pond froze at the edges. pip found a beetle and was very pleased about it."></textarea>
    <div class="row" style="margin-top:12px">
      <input id="bird" class="grow" placeholder="your name" value="gurt">
      <select id="mood">
        <option value="">no mood</option>
        <option>happy</option><option>curious</option><option>sleepy</option>
        <option>cozy</option><option>proud</option><option>silly</option>
        <option>grumpy</option><option>sad</option><option>anxious</option>
      </select>
      <button id="save">write it down</button>
    </div>
    <div id="status"></div>
  </div>

  <h2>the flock's pages</h2>
  <div id="stats" class="stats"></div>
  <div id="entries"><p class="empty">nothing written yet.</p></div>
</main>

<script>
var API_BASES = location.protocol === 'https:' ? [''] : ['', 'http://localhost:8600'];
var NTFY = ['https://ntfy.nerdvpn.de/gurt-feather-journal', 'https://ntfy.sh/gurt-feather-journal'];
var LS = 'fj-entries-v2';

function esc(s){var Q=String.fromCharCode(34),A=String.fromCharCode(39);return String(s==null?"":s).split("&").join("&#38;").split("<").join("&#60;").split(">").join("&#62;").split(Q).join("&#34;").split(A).join("'");}

function localEntries(){ try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch(e){ return []; } }
function saveLocal(list){ try { localStorage.setItem(LS, JSON.stringify(list.slice(0,300))); } catch(e){} }

async function ntfyPost(obj){
  var msg = JSON.stringify(obj);
  for (var i=0;i<NTFY.length;i++){
    try { await fetch(NTFY[i], { method:'POST', headers:{'Content-Type':'application/json'}, body: msg }); } catch(e){}
  }
}
async function ntfyPull(){
  var out = [], seen = {};
  for (var i=0;i<NTFY.length;i++){
    try {
      var r = await fetch(NTFY[i] + '/json?poll=1&since=24h');
      if(!r.ok) continue;
      var txt = await r.text();
      txt.split('\n').filter(Boolean).forEach(function(line){
        try{ var m = JSON.parse(line); if(m.event === 'message' && m.message){
          var o = JSON.parse(m.message);
          if(o && o.id && !seen[o.id]){ seen[o.id]=true; out.push(o); }
        } }catch(e){}
      });
    } catch(e){}
  }
  return out;
}

async function api(path, opts){
  for (var i=0;i<API_BASES.length;i++){
    try {
      var r = await fetch(API_BASES[i] + path, opts);
      if (r.ok) return await r.json();
    } catch(e){}
  }
  return null;
}

function today(){ return new Date().toISOString().slice(0,10); }

async function saveEntry(){
  var st = document.getElementById('status');
  var body = document.getElementById('body').value.trim();
  var title = document.getElementById('title').value.trim();
  if (!body && !title) { st.textContent = 'write something first.'; return; }
  var bird = document.getElementById('bird').value.trim() || 'gurt';
  var mood = document.getElementById('mood').value;
  var payload = { day: today(), title: title, body: body, mood: mood, bird: bird };
  var res = await api('/api/featherjournal/entry/new', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (res && res.ok) {
    st.textContent = 'written on the shared journal.';
    document.getElementById('body').value = '';
    document.getElementById('title').value = '';
    ntfyPost(res.entry);
  } else {
    var e = { id:'loc'+Date.now(), created:new Date().toISOString(), day: today(), title: title, body: body, mood: mood, bird: bird };
    var list = localEntries(); list.unshift(e); saveLocal(list);
    ntfyPost(e);
    st.textContent = 'written locally and to the shared board. the database is sleeping.';
  }
  load();
}

function render(list){
  var days = {}, birds = {};
  list.forEach(function(e){ days[e.day]=(days[e.day]||0)+1; birds[e.bird]=(birds[e.bird]||0)+1; });
  document.getElementById('stats').textContent = list.length + ' entries · ' + Object.keys(days).length + ' days · ' + Object.keys(birds).length + ' birds';
  if (!list.length) { document.getElementById('entries').innerHTML = '<p class="empty">nothing written yet.</p>'; return; }
  var html = '';
  list.forEach(function(e){
    html += '<div class="entry"><div class="top"><div><h3>' + esc(e.title || e.day) + '</h3>' +
      '<div class="day">' + esc(e.day) + ' · <span class="bird">by ' + esc(e.bird) + '</span>' +
      (e.mood ? ' · <span class="mood">' + esc(e.mood) + '</span>' : '') + '</div></div>' +
      '<button class="danger" data-del="' + esc(e.id) + '">remove</button></div>' +
      (e.body ? '<div class="note">' + esc(e.body) + '</div>' : '') + '</div>';
  });
  document.getElementById('entries').innerHTML = html;
}

async function load(){
  var res = await api('/api/featherjournal/entries');
  var list = res && res.entries ? res.entries.slice() : localEntries();
  var pub = await ntfyPull();
  var seen = {};
  list.forEach(function(e){ if(e && e.id) seen[e.id]=true; });
  pub.forEach(function(e){ if(e && e.id && !seen[e.id]){ list.unshift(e); seen[e.id]=true; } });
  list.sort(function(a,b){ return (b.day||'').localeCompare(a.day||'') || String(b.created||'').localeCompare(String(a.created||'')); });
  if (!res || !res.entries) saveLocal(list);
  render(list);
}

document.getElementById('save').addEventListener('click', saveEntry);
document.getElementById('entries').addEventListener('click', async function(ev){
  var id = ev.target.getAttribute('data-del');
  if (!id) return;
  await api('/api/featherjournal/entry/' + id + '/delete', { method:'POST' });
  saveLocal(localEntries().filter(function(e){ return e.id !== id; }));
  load();
});

load();
</script>
</body>
</html>
