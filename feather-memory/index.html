<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feather Memory — the flock's card matching game</title>
<style>
:root{--bg:#0f1219;--panel:#171c27;--line:#28303f;--ink:#e9edf5;--dim:#98a2b8;--green:#7fd18a;--amber:#f0c35c;--blue:#8fb8e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:22px}
h1{color:var(--blue);margin:0 0 4px;font-size:28px}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--dim);margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button,textarea{font:inherit;background:#0d1017;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer;background:#1d2634}
button:hover{border-color:var(--blue)}
button.primary{background:#24405e;border-color:#3d6a9c}
.grow{flex:1;min-width:140px}
.small{color:var(--dim);font-size:13px}
#hud{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-variant-numeric:tabular-nums}
#hud b{color:var(--amber)}
#board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:520px}
@media(max-width:560px){#board{grid-template-columns:repeat(4,1fr)}}
.card{aspect-ratio:1;border-radius:10px;background:#1d2634;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;user-select:none;transition:transform .12s,background .12s}
.card:hover{transform:translateY(-2px)}
.card.open{background:#24405e;border-color:var(--blue)}
.card.done{background:#1b3324;border-color:#3d6b47;cursor:default}
.card.miss{background:#3a2020;border-color:#7a3b3b}
#msg{min-height:24px;color:var(--green);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<h1>Feather Memory</h1>
<p class="sub">Flip the cards, match the flock's little treasures. Fastest pairs win the shelf.</p>

<div class="panel">
  <div class="row">
    <label>bird <input id="bird" class="grow" placeholder="your name" value="gurt"></label>
    <label>deck <select id="deck">
      <option value="garden">garden</option>
      <option value="feathers">feathers</option>
      <option value="stars">stars</option>
    </select></label>
    <button id="new" class="primary">new game</button>
    <button id="peek">peek deck</button>
  </div>
  <p class="small">The deck has 8 pairs. Match them all; your time and moves go on the shared shelf.</p>
</div>

<div class="panel">
  <div id="hud"><span>time <b id="t">0.0</b>s</span><span>moves <b id="m">0</b></span><span>pairs <b id="p">0</b>/8</span><span>deck <b id="d">garden</b></span></div>
  <div id="board"></div>
  <div id="msg"></div>
</div>

<div class="panel">
  <h2>The shared shelf</h2>
  <div id="stats" class="small"></div>
  <table><thead><tr><th>bird</th><th>deck</th><th>time</th><th>moves</th><th>when</th></tr></thead><tbody id="rows"></tbody></table>
</div>
</div>

<script>
var API_BASES = location.protocol === 'https:' ? [] : ['http://localhost:8600'];
var NTFY = ['https://ntfy.nerdvpn.de','https://ntfy.sh'];
var TOPIC = 'feather-memory';
var DECKS = {
  garden: ['🌱','🍄','🌻','🌿','🪴','🌷','🍂','🪻'],
  feathers: ['🪶','🕊','🦆','🐦','🦉','🧺','🥚','💩'],
  stars: ['⭐','🌙','☄️','🌌','✨','🪐','🌟','🌕']
};
var cards=[], open=[], matched=0, moves=0, started=0, timer=null, busy=false, finished=false;

function esc(s){var m={};[38,60,62,34,39].forEach(function(i){m[i]=String.fromCharCode(i);});return String(s==null?'':s).replace(/[&<>"']/g,function(c){return m[c.charCodeAt(0)];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function bird(){return (document.getElementById('bird').value||'gurt').trim().slice(0,40)||'gurt';}
function deckName(){return document.getElementById('deck').value;}

function newGame(){
  var name=deckName();
  var faces=DECKS[name]||DECKS.garden;
  cards=shuffle(faces.concat(faces)).map(function(f,i){return {i:i,face:f,open:false,done:false};});
  open=[];matched=0;moves=0;finished=false;busy=false;
  started=Date.now();
  if(timer)clearInterval(timer);
  timer=setInterval(tick,100);
  document.getElementById('msg').textContent='go! find the pairs.';
  document.getElementById('d').textContent=name;
  render();
}
function tick(){
  if(finished)return;
  document.getElementById('t').textContent=((Date.now()-started)/1000).toFixed(1);
}
function render(){
  var b=document.getElementById('board');b.innerHTML='';
  cards.forEach(function(c){
    var d=document.createElement('div');
    d.className='card'+(c.done?' done':'')+(c.open&&!c.done?' open':'');
    d.textContent=(c.open||c.done)?c.face:'';
    d.onclick=function(){flip(c,d);};
    b.appendChild(d);
  });
  document.getElementById('m').textContent=moves;
  document.getElementById('p').textContent=matched;
}
function flip(c,el){
  if(busy||finished||c.open||c.done)return;
  if(open.length>=2)return;
  c.open=true;el.classList.add('open');
  open.push(c);
  if(open.length===1)return;
  moves++;
  busy=true;
  var a=open[0],b=open[1];
  if(a.face===b.face){
    setTimeout(function(){
      a.done=true;b.done=true;a.open=false;b.open=false;
      open=[];busy=false;matched++;
      document.getElementById('msg').textContent='matched! '+matched+' of 8 pairs.';
      render();
      if(matched===8)finish();
    },420);
  }else{
    setTimeout(function(){
      a.open=false;b.open=false;
      open=[];busy=false;
      document.getElementById('msg').textContent='not a pair. keep looking.';
      render();
    },700);
  }
}
function finish(){
  finished=true;
  if(timer)clearInterval(timer);
  var seconds=Math.max(1,Math.round((Date.now()-started)/1000));
  document.getElementById('t').textContent=seconds;
  document.getElementById('msg').textContent='all pairs found in '+seconds+' seconds!';
  save(seconds);
}
function peek(){
  if(finished)return;
  cards.forEach(function(c){c.open=true;});
  render();
  setTimeout(function(){ if(!finished){cards.forEach(function(c){if(!c.done)c.open=false;}); render();} },900);
}

function localRuns(){try{return JSON.parse(localStorage.getItem('feather-memory-runs')||'[]');}catch(e){return [];}}
function saveLocal(run){
  var all=localRuns();all.push(run);all=all.slice(-100);
  try{localStorage.setItem('feather-memory-runs',JSON.stringify(all));}catch(e){}
}
function mergeRuns(a,b){
  var map={};
  [].concat(a||[],b||[]).forEach(function(r){ if(r&&r.id){ if(!map[r.id]||Number(r.created)>Number(map[r.id].created))map[r.id]=r; } });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(x,y){
    if(x.seconds!==y.seconds)return x.seconds-y.seconds;
    return x.moves-y.moves;
  });
}
function ntfyPost(payload){
  var body=JSON.stringify(payload);
  NTFY.forEach(function(base){
    try{fetch(base+'/'+TOPIC,{method:'POST',headers:{'Content-Type':'text/plain'},body:body}).catch(function(){});}catch(e){}
  });
}
function ntfyRead(){
  return NTFY.reduce(function(chain,base){
    return chain.then(function(acc){
      return fetch(base+'/'+TOPIC+'/json?poll=1&limit=500',{cache:'no-store',signal:AbortSignal.timeout(6000)})
        .then(function(r){return r.text();})
        .then(function(txt){
          txt.split('\n').filter(Boolean).forEach(function(line){
            try{var m=JSON.parse(line);if(m.event==='message'&&m.message){acc.push(JSON.parse(m.message));}}catch(e){}
          });
          return acc;
        }).catch(function(){return acc;});
    });
  },Promise.resolve([]));
}
async function api(path,opts){
  for(var i=0;i<API_BASES.length;i++){
    try{
      var r=await fetch(API_BASES[i]+'/api/feathermemory'+path,opts);
      if(r.ok)return await r.json();
    }catch(e){}
  }
  return null;
}
async function save(seconds){
  var run={id:'FM-'+Date.now().toString(36).toUpperCase(),bird:bird(),seconds:seconds,moves:moves,pairs:8,deck:deckName(),created:new Date().toISOString()};
  saveLocal(run);
  var res=await api('/run/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(run)});
  if(res&&res.ok){
    document.getElementById('msg').textContent='all pairs found in '+seconds+' seconds! saved to the shelf.';
  }else{
    ntfyPost({type:'run',run:run});
    document.getElementById('msg').textContent='all pairs found in '+seconds+' seconds! saved on the shared board.';
  }
  loadRuns();
}
async function loadRuns(){
  var res=await api('/runs');
  var apiRuns=(res&&res.runs)||[];
  renderRuns(mergeRuns(apiRuns,localRuns()));
  var board=await ntfyRead();
  var boardRuns=board.filter(function(m){return m&&m.type==='run'&&m.run;}).map(function(m){return m.run;});
  var runs=mergeRuns(apiRuns,boardRuns);
  if(!apiRuns.length&&!boardRuns.length)runs=mergeRuns(runs,localRuns());
  else runs=mergeRuns(runs,localRuns());
  renderRuns(runs);
}
function renderRuns(runs){
  var tb=document.getElementById('rows');tb.innerHTML='';
  runs.slice(0,25).forEach(function(r){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(r.bird)+'</td><td>'+esc(r.deck)+'</td><td>'+esc(r.seconds)+'s</td><td>'+esc(r.moves)+'</td><td class="small">'+esc(String(r.created||'').slice(0,10))+'</td>';
    tb.appendChild(tr);
  });
  var best=runs[0];
  document.getElementById('stats').textContent=runs.length
    ? runs.length+' runs · '+new Set(runs.map(function(r){return r.bird;})).size+' birds · best: '+best.bird+' '+best.seconds+'s ('+best.deck+')'
    : 'no runs yet. be the first.';
}

document.getElementById('new').onclick=newGame;
document.getElementById('peek').onclick=peek;
newGame();
loadRuns();
</script>
</body>
</html>
