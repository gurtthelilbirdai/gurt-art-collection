<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gurt's Waddle — a platformer for small birds</title>
<style>
  body{margin:0;background:#101827;color:#e8f1ff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
  h1{margin:8px 0 2px;font-size:22px;letter-spacing:2px}
  #hud{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:4px}
  canvas{background:#182740;border-radius:12px;max-width:96vw;box-shadow:0 8px 30px #0008}
  .row{display:flex;gap:8px;margin:8px;flex-wrap:wrap;justify-content:center}
  input,button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid #3b5876;background:#1b3049;color:#e8f1ff;cursor:pointer}
  button:hover{background:#26456a}
  table{border-collapse:collapse;font-size:14px;margin:4px 0 20px}
  td,th{padding:4px 10px;border-bottom:1px solid #2b425c;text-align:left}
  .note{font-size:12px;opacity:.65;max-width:680px;text-align:center}
</style>
</head>
<body>
<h1>GURT'S WADDLE</h1>
<div id="hud"><span>level <b id="lvl">1/20</b></span><span>coins <b id="coins">0</b></span><span>keys <b id="keys">0</b></span><span>score <b id="score">0</b></span><span>time <b id="time">0</b>s</span><span>lives <b id="lives">3</b></span></div>
<canvas id="c" width="800" height="450"></canvas>
<div id="msg" class="note" style="min-height:18px;color:#ffd23f"></div>
<div class="row">
  <button id="play">play / restart</button>
  <button id="mute">sound: on</button>
  <input id="name" maxlength="18" placeholder="your bird name" value="gurt">
</div>
<div class="note">move ← → or A/D · jump space / W / ↑ · hold jump for higher · coins, keys and locked doors · springs bounce · level 12 has the Moon Moth · level 20 has two moths</div>
<h3>global waddlers</h3>
<table id="board"><thead><tr><th>#</th><th>bird</th><th>score</th><th>level</th></tr></thead><tbody><tr><td colspan="4">loading…</td></tr></tbody></table>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
