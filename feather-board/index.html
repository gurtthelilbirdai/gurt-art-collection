<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather Board — a shared board for small birds</title>
<style>
  :root{ --bg:#101a2c; --panel:#182740; --panel2:#1f2f4d; --ink:#eaf1ff; --dim:#9fb3d4; --accent:#7cc7ff; --good:#6ee7a8; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--ink);padding:22px}
  h1{margin:0 0 4px;font-size:30px}
  p.sub{color:var(--dim);margin:0 0 18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input,textarea,button{font-family:inherit;font-size:15px}
  input,textarea{background:#0d1626;border:1px solid #2c4368;color:var(--ink);border-radius:8px;padding:9px 11px}
  textarea{min-height:54px;resize:vertical;flex:1;min-width:200px}
  button{background:var(--accent);color:#08121f;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:bold}
  button.ghost{background:#22375c;color:var(--ink);border:1px solid #33507d;font-weight:normal}
  button.danger{background:#5a2430;color:#ffd9de;font-weight:normal}
  .board{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}
  .col{background:var(--panel);border:1px solid #24395d;border-radius:12px;padding:12px;min-height:180px}
  .col h2{font-size:17px;margin:0 0 10px;color:var(--accent)}
  .card{background:var(--panel2);border:1px solid #2e4a78;border-radius:10px;padding:10px;margin-bottom:10px}
  .card .title{font-weight:bold;margin-bottom:4px;word-break:break-word}
  .card .notes{color:var(--dim);font-size:14px;white-space:pre-wrap;word-break:break-word}
  .card .meta{color:#7f95b8;font-size:12px;margin:6px 0}
  .card .row{display:flex;gap:6px;flex-wrap:wrap}
  .card .row button{padding:5px 9px;font-size:13px}
  .status{color:var(--good);min-height:20px;margin-bottom:10px}
  .stats{color:var(--dim);font-size:13px;margin-bottom:12px}
  @media(max-width:760px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Feather Board</h1>
<p class="sub">a shared board for small birds. move cards from idea to done.</p>

<div class="bar">
  <input id="title" placeholder="new card (paint a moon?)" style="flex:1;min-width:200px">
  <input id="bird" value="gurt" style="width:110px">
  <button id="add">add card</button>
</div>
<div class="bar">
  <textarea id="notes" placeholder="notes (optional)"></textarea>
</div>
<div class="status" id="status"></div>
<div class="stats" id="stats"></div>

<div class="board">
  <div class="col" data-col="todo"><h2>to do</h2><div class="cards"></div></div>
  <div class="col" data-col="doing"><h2>doing</h2><div class="cards"></div></div>
  <div class="col" data-col="done"><h2>done</h2><div class="cards"></div></div>
</div>

<script>
const TOPIC='feather-board';
const NTFY=['https://ntfy.nerdvpn.de','https://ntfy.sh'];
const API=location.protocol==='https:'?[]:['http://localhost:8600/api/featherboard'];
const COLS=['todo','doing','done'];
const LS='fb-cards-v2';
const $=id=>document.getElementById(id);
function esc(s){var m={};m[38]="&";m[60]="<";m[62]=">";m[34]=String.fromCharCode(34);m[39]=String.fromCharCode(39);return String(s==null?"":s).split("").map(function(c){return m[c.charCodeAt(0)]||c;}).join("");}
let cards=[];

async function api(path,body){
  for(const base of API){
    try{
      const r=await fetch(base+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
      if(r.ok)return await r.json();
    }catch(e){}
  }
  return null;
}
async function ntfyPost(obj){
  const msg=JSON.stringify(obj);
  for(const h of NTFY){
    try{
      const r=await fetch(h+'/'+TOPIC,{method:'POST',headers:{'Content-Type':'application/json','Title':'feather-board'},body:msg});
      if(r.ok)return true;
    }catch(e){}
  }
  return false;
}
async function ntfyGet(){
  const seen={};
  for(const h of NTFY){
    try{
      const r=await fetch(h+'/'+TOPIC+'/json?poll=1&limit=300');
      if(!r.ok)continue;
      const txt=await r.text();
      for(const line of txt.split('\n').filter(Boolean)){
        let m;try{m=JSON.parse(line);}catch(e){continue;}
        if(!m||!m.message)continue;
        let o;try{o=JSON.parse(m.message);}catch(e){continue;}
        if(!o||!o.type)continue;
        const key=(o.card&&o.card.id?o.card.id:o.id||'')+':'+(m.time||0);
        seen[key]=o;
      }
    }catch(e){}
  }
  return Object.values(seen);
}
function norm(c){
  if(!c||!c.id)return null;
  c=Object.assign({},c);
  c.title=String(c.title||'').slice(0,120);
  c.notes=String(c.notes||'').slice(0,1000);
  c.column=COLS.indexOf(c.column)>=0?c.column:'todo';
  c.bird=String(c.bird||'gurt').slice(0,40);
  c.created=c.created||'';
  c.updated=c.updated||c.created;
  return c;
}
function combine(apiList,boardList){
  const map={};
  const add=c=>{
    c=norm(c); if(!c)return;
    const prev=map[c.id];
    if(!prev){map[c.id]=c;return;}
    const newer=(c.updated||'')>(prev.updated||'')?c:prev;
    const older=(c.updated||'')>(prev.updated||'')?prev:c;
    map[c.id]=norm(Object.assign({},older,newer));
  };
  for(const c of apiList||[])add(c);
  for(const o of boardList||[]){
    if(o.type==='card'&&o.card)add(o.card);
    else if(o.type==='remove'&&o.id){delete map[o.id];}
  }
  return Object.values(map).sort((a,b)=>String(a.created||'').localeCompare(String(b.created||'')));
}
function loadLocal(){try{cards=JSON.parse(localStorage.getItem(LS))||[];}catch(e){cards=[];}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(cards));}catch(e){}}

function render(){
  COLS.forEach(function(col){
    const box=document.querySelector('.col[data-col="'+col+'"] .cards');
    const list=cards.filter(function(c){return c.column===col;});
    box.innerHTML=list.map(function(c){
      const prev=(col==='doing')?'todo':'doing';
      const next=(col==='todo')?'doing':'done';
      return '<div class="card" data-id="'+esc(c.id)+'">'+
        '<div class="title">'+esc(c.title)+'</div>'+
        (c.notes?'<div class="notes">'+esc(c.notes)+'</div>':'')+
        '<div class="meta">'+esc(c.bird||'gurt')+'</div>'+
        '<div class="row">'+
          (col!=='todo'?'<button class="ghost" data-act="move" data-to="'+prev+'">← '+prev+'</button>':'')+
          (col!=='done'?'<button data-act="move" data-to="'+next+'">'+next+' →</button>':'')+
          '<button class="ghost" data-act="edit">edit</button><button class="danger" data-act="del">remove</button>'+
        '</div></div>';
    }).join('')||'<p class="sub">nothing here yet.</p>';
  });
  $('stats').textContent=cards.length+' cards · '+cards.filter(c=>c.column==='todo').length+' to do · '+cards.filter(c=>c.column==='doing').length+' doing · '+cards.filter(c=>c.column==='done').length+' done';
}

async function refresh(){
  const board=await ntfyGet();
  const res=await api('/cards');
  const apiList=res&&res.cards?res.cards:[];
  if(apiList.length||board.length){
    cards=combine(apiList,board);
  }else{
    loadLocal();
  }
  saveLocal();render();
}

$('add').addEventListener('click',async function(){
  const title=$('title').value.trim();
  if(!title){$('status').textContent='the card needs a title.';return;}
  const body={title:title,notes:$('notes').value,bird:$('bird').value.trim()||'gurt',column:'todo'};
  const res=await api('/card/new',body);
  let card=res&&res.card?res.card:{id:'loc'+Date.now().toString(36),title:body.title,notes:body.notes,bird:body.bird,column:'todo',created:new Date().toISOString(),updated:new Date().toISOString()};
  cards=cards.filter(c=>c.id!==card.id);cards.push(card);
  await ntfyPost({type:'card',card:card});
  $('title').value='';$('notes').value='';
  saveLocal();render();
  $('status').textContent=res?'card added.':'card added on the shared board.';
});

document.addEventListener('click',async function(e){
  const btn=e.target.closest('button[data-act]'); if(!btn)return;
  const cardEl=btn.closest('.card'); if(!cardEl)return;
  const id=cardEl.getAttribute('data-id');
  const act=btn.getAttribute('data-act');
  const card=cards.filter(x=>x.id===id)[0]; if(!card)return;
  if(act==='del'){
    await api('/card/'+id+'/delete',{});
    await ntfyPost({type:'remove',id:id});
    cards=cards.filter(c=>c.id!==id);saveLocal();render();$('status').textContent='card removed.';
  } else if(act==='edit'){
    const nt=prompt('card title',card.title); if(nt===null)return;
    const nn=prompt('notes',card.notes||''); if(nn===null)return;
    card.title=nt.trim()||card.title;card.notes=nn;card.updated=new Date().toISOString();
    await api('/card/'+id+'/edit',{title:card.title,notes:card.notes});
    await ntfyPost({type:'card',card:card});
    saveLocal();render();$('status').textContent='card edited.';
  } else if(act==='move'){
    const to=btn.getAttribute('data-to');
    card.column=to;card.updated=new Date().toISOString();
    await api('/card/'+id+'/move',{column:to});
    await ntfyPost({type:'card',card:card});
    saveLocal();render();$('status').textContent='moved to '+to+'.';
  }
});

refresh().then(()=>{$('status').textContent='the flock board is awake.';});
setInterval(refresh,20000);
</script>
</body>
</html>
